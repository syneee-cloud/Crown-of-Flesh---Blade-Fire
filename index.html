<script>
const S=[
{id:"historia",t:"Historia y cronología",i:"Cinco períodos, desde el origen de la existencia hasta el mundo actual.",p:[
["antes","Antes del Nombre","Los orígenes de la existencia",`Antes de los reinos, cuatro principios obraban sin nombre: lo que hace comenzar, dar forma, agotar y recibir. [[physeon|Phýseon]] pobló las aguas someras de vida indiscriminada, [[elyr|El’yr]] abrió la posibilidad de la forma, [[aphanes|Aphanes]] marcó los finales y [[nevar|Nev’ar]] recibió los restos.
El primer pueblo pensante fueron los gigantes: longevos, de pocos hijos, que registraban su vida en cordones de nudos y no fundaron reinos. Su esterilidad, de causa desconocida, es irreversible, y los pocos supervivientes viven hoy en las regiones polares.`],
["aurora","La Segunda Aurora","Pueblos, primeras ciudades y reinos",`Los elfos despertaron hace unos treinta mil años; los enanos salieron de la roca de las grandes cordilleras; los orcos llegaron a caballo, en fuegos y confederaciones; los humanos, los últimos, aparecieron unos siete mil años antes del Cierre.
La primera gran guerra enfrentó a elfos y enanos por la madera y el carbón, y terminó cuando Sarn Vokh los obligó a comerciar antes de hablar. Kaldur Orren legó su vara de medir, Ysolde Terrin fundó la gran ciudad del delta e Ilvaren Soth-Amaleth dejó una ley que se entonaba.`],
["umbral","El Umbral","El descubrimiento de la magia",`Hace unos tres mil años antes del Cierre, parteras, cantores y funerarios descubrieron que la atención sostenida podía actuar sobre los dominios de los principios. Ysmerai Dohl convirtió la mano atenta en una disciplina enseñable: nació la [[cuerpo|Magia del Cuerpo]]; después, la [[alma|Magia del Alma]] y la [[muerte|Magia de la Muerte]].
Maelis Dorrane, que se negó a morir, dio origen a los vampiros; antiguas maldiciones originaron a los pueblos bestiales y a los minotauros.`],
["templos","La Era de los Templos","Auge, abusos y Cierre",`Los templos de la muerte fueron respetados durante siglos, hasta que los abusos los desprestigiaron. [[edran|Edran Veyl]], sacerdote que murió y volvió incompleto, fue admitido por Nev’ar como su Heraldo. La reina Adelmira regresó sin recuerdos, estalló una guerra de ejércitos de cadáveres y cinco coronas y tres órdenes religiosas se aliaron.
El Edicto del Cierre clausuró los templos y prohibió la Magia de la Muerte; con él nace el Cómputo, el calendario común. Orsolya Kendrel logró que parte de los archivos se sellara en lugar de quemarse.`],
["mundo","El Mundo que Quedó","Las herencias del pasado",`Han pasado unos mil cien años desde el Cierre. Tres [[imperios|imperios]] de escala comparable dominan los continentes; la magia está regulada y la de la Muerte, prohibida. Existen unas pocas decenas de Ascendidos, y los últimos gigantes habitan los hielos polares.
No hay profecía pendiente: el mundo se ofrece a quien quiera tomarlo.`]]},
{id:"deidades",t:"Deidades y entidades",i:"Los cuatro principios primordiales y sus Heraldos.",p:[
["physeon","Phýseon","La Vida",`Es la vida, el crecimiento y la existencia biológica. Puede acelerar el crecimiento, curar heridas que debieron ser mortales y sostener la vitalidad más allá de lo natural. Carece de filtro moral: ha dado origen a criaturas hermosas y a parásitos y abominaciones. Su Heraldo es [[madre|la Madre]].`],
["elyr","El’yr","La Creación",`Es la formación de lo que antes no existía: ideas, estructuras, civilizaciones, conocimiento y herramientas. No elige en qué se convierte lo que ayuda a nacer: el mismo saber levanta reinos o forja armas capaces de arrasar ciudades. Su Heraldo es [[tejedor|el Tejedor]].`],
["aphanes","Aphanes","La Destrucción",`Es el final de aquello que debe desaparecer. Desmorona imperios, extingue plagas y borra lo insostenible, sin construir nada después. Es indiferente al sufrimiento: no distingue culpas de inocencias. Su Heraldo es [[azote|el Azote]].`],
["nevar","Nev’ar","La Muerte",`Recibe cada alma, determina su destino según el [[karma|Karma]] y puede encerrarla, concederle descanso o, de forma excepcional, permitirle volver a cambio de un precio. Administra una forma de justicia, pero no es compasiva ni cruel. Su Heraldo es [[edran|Edran Veyl]].`],
["madre","La Madre","Heraldo de Phýseon",`Acompaña el primer aliento de todo ser vivo. Su rostro cambia según quien la recuerde, pero siempre lleva en brazos a un recién nacido dormido. No decide quién merece vivir ni cuánto: solo vela por que la existencia llegue a comenzar.`],
["tejedor","El Tejedor","Heraldo de El’yr",`Un anciano de barba blanca que aparece cuando una civilización necesita algo que aún no posee. Entrega la posibilidad y se retira antes de ver qué se hace con ella. Siempre lleva entre los dedos un hilo que no tiene fin.`],
["azote","El Azote","Heraldo de Aphanes",`Sin origen conocido ni forma fija, aparece cuando algo ha llegado al final de su tiempo. Todos los relatos coinciden en una espada en llamas y un látigo. No pregunta quién es culpable: termina lo que debe terminar.`],
["edran","Edran Veyl","La Muerte · Heraldo de Nev’ar",`Fue un sacerdote que estudió la muerte, intentó retrasar la suya y regresó incompleto. Nev’ar lo admitió como su Heraldo: conduce a los muertos y examina su [[karma|Karma]]. No persigue a nadie: quien se vuelve a mirar, lo encuentra delante.`],
["karma","Karma","El registro de una vida",`Energía presente en todos los seres vivos que registra su relación con la existencia; no es premio ni castigo. Tiene tres estados: Benigno (Más Allá sin condena), Maligno (alma condenada y encerrada) y Excéntrico, rarísimo y anómalo, que no es neutralidad. [[edran|Edran]] examina el registro; durante el juicio no transcurre tiempo fuera de él.`]]},
{id:"continentes",t:"Continentes y geografía",i:"Atlas interactivo de los cuatro continentes.",p:[
["eldoria","Eldoria","El continente más antiguo",`El más antiguo del mundo, marcado por ruinas y civilizaciones fragmentadas. Bosques viejos, páramos y costas frías, con cortes élficas que se disputan la herencia de la canción original. [[marvayne|Marvayne]] domina casi todo el continente; [[velmoria|Velmoria]] posee provincias costeras al sur.
<em>Pendiente de completar: regiones y culturas.</em>`],
["valdren","Valdren","El mayor y centro de poder",`El mayor de los continentes y uno de los principales centros de poder. Llanuras fértiles, una gran cordillera y estepas interiores. [[ithravell|Ithravell]] domina casi todo el continente; Velmoria mantiene puertos y provincias costeras en el oeste.
<em>Pendiente de completar: regiones y culturas.</em>`],
["elyndar","Elyndar","Ríos y comercio marítimo",`Continente de civilizaciones fluviales y comercio marítimo: grandes ríos, deltas y lagunas bajo un clima cálido y húmedo. Lo ocupa por completo [[velmoria|Velmoria]].
<em>Pendiente de completar: regiones y culturas.</em>`],
["avernia","Avernia","Alianzas y uniones",`Reúne regiones diversas, con una larga historia de alianzas y uniones políticas: fiordos, llanuras, tierras altas y bosques cerrados. Es el lugar donde se cruzan las fronteras de los tres imperios: [[ithravell|Ithravell]] al sur y al este, [[marvayne|Marvayne]] al norte y al oeste.
<em>Pendiente de completar: regiones y culturas.</em>`]]},
{id:"imperios",t:"Imperios pluriespecie",i:"Tres potencias de escala comparable, habitadas por varias especies; ninguna es mejor ni más fuerte que otra.",p:[
["ithravell","Ithravell","«Lo que alcanzamos, lo ordenamos.»",`<b>Territorio.</b> Casi todo [[valdren|Valdren]] y el sur y el este de [[avernia|Avernia]].
<b>Sistema político.</b> Imperio centralizado y expansionista: un emperador gobierna mediante gobernadores y un consejo, bajo una ley escrita única que también lo vincula. Los cargos se otorgan por mérito y la ciudadanía, por servicio.
<b>Economía.</b> Agricultura intensiva, comercio por calzada, recaudación regular y estandarización.
<b>Cultura.</b> Disciplina, utilidad y constancia; arte monumental y funcional.
<b>Religión.</b> Libertad de culto; el Cuaternismo domina las ciudades y el Naturalismo arraiga en algunas legiones, sin ser religión de Estado.
<b>Fortalezas.</b> Ejército profesional, ingeniería, administración uniforme.
<b>Debilidades.</b> Provincias lejanas, peso político del ejército y fronteras que crecen más deprisa que la administración.
<b>Relaciones.</b> Ve a [[marvayne|Marvayne]] como un vecino lento pero firme y a [[velmoria|Velmoria]] como un socio imprescindible y difícil.`],
["marvayne","Marvayne","«Lo que fue, nos sostiene.»",`<b>Territorio.</b> Casi todo [[eldoria|Eldoria]] y las tierras altas del norte y el oeste de [[avernia|Avernia]].
<b>Sistema político.</b> Monarquía aristocrática: una corona hereditaria sostenida por casas mayores con feudos vinculados por juramento. La corona arbitra como primera entre iguales y puede ennoblecer por mérito.
<b>Economía.</b> Agricultura, madera, minas, lana y artesanía refinada; amplía su influencia mediante alianzas y matrimonios.
<b>Cultura.</b> Memoria, linaje y palabra dada; mecenazgo y estética gótica de piedra oscura, agujas y vidrieras.
<b>Religión.</b> Predomina el Cuaternismo, con capillas hereditarias.
<b>Fortalezas.</b> Cohesión de los linajes, red de fortalezas y riqueza cultural.
<b>Debilidades.</b> Rivalidad entre casas, rigidez y sucesiones que reabren viejos agravios.
<b>Relaciones.</b> Ve a [[ithravell|Ithravell]] como un vecino eficaz pero impaciente y a [[velmoria|Velmoria]] como un socio generoso pero poco previsible.`],
["velmoria","Velmoria","«Lo que se pacta, se cumple.»",`<b>Territorio.</b> Todo [[elyndar|Elyndar]], más provincias costeras del oeste de [[valdren|Valdren]] y del sur de [[eldoria|Eldoria]], por tratado.
<b>Sistema político.</b> Imperio mercantil y representativo: asambleas de ciudadanos y gremios, una asamblea general de delegados y un magistrado supremo elegido por un periodo fijo, bajo una carta común y una judicatura independiente.
<b>Economía.</b> Comercio marítimo y fluvial, banca, crédito y derecho mercantil uniforme.
<b>Cultura.</b> Pragmática y cosmopolita; el contrato es la base de la vida social.
<b>Religión.</b> Predomina la Custodia; las escuelas de magia se licencian por gremio.
<b>Fortalezas.</b> Flotas, redes comerciales y un derecho común.
<b>Debilidades.</b> Decisiones lentas, rivalidad entre gremios y provincias, dependencia de las rutas marítimas.
<b>Relaciones.</b> Pacta con cautela con [[ithravell|Ithravell]] y confía en [[marvayne|Marvayne]], de ritmo lento pero palabra firme.`]]},
{id:'reinos',t:'Reinos',i:'Cuatro reinos de una sola especie, a diferencia de los tres imperios pluriespecie: cada uno gira en torno a la memoria, las leyes y las costumbres de un único pueblo.',p:[
['yavannor','Yavannor','🌿 Reino élfico',`Un reino de antiguos bosques, arquitectura refinada y tradiciones ancestrales, donde los elfos mantienen una estrecha relación con la naturaleza y protegen celosamente su herencia. Sus ciudades no se levantan, se cultivan: raíces guiadas durante siglos forman los muros, y ramas entrelazadas sostienen terrazas y puentes.
Su origen se remonta a los primeros elfos, que despertaron hace unos treinta mil años en los bosques húmedos y cantaban su historia en lugar de escribirla. Yavannor se considera heredero de quienes, durante la larga disputa que disolvió el antiguo reino de los Cantores, defendieron conservar la canción ancestral sin alterar una sola sílaba. Desde entonces su legitimidad descansa en la memoria: cada familia recuerda a sus antepasados y la ley se transmite de viva voz.
A diferencia de los imperios, es un reino de una sola especie: sus costumbres, su calendario y su arte giran en torno a los elfos, y su trato con los demás pueblos mezcla curiosidad, cautela y orgullo.
<em>Pendiente de completar: ubicación, sistema político, economía y relaciones.</em>`],
['solgravia','Solgravia','🌞 Reino humano',`Un reino de tradición, nobleza y ambición humana, levantado sobre ciudades fortificadas, campos fértiles y una monarquía que busca preservar su legado. Sus murallas y torres vigilan los campos que alimentan a una población numerosa.
Los humanos, la última de las grandes razas en aparecer, se asentaron donde otros no lo habían hecho y aprendieron de todos sin pedir permiso. Solgravia es la forma más ordenada de esa expansión: una corona hereditaria sostenida por una nobleza que compite por tierras, cargos y prestigio. Su historia es la de sus dinastías, y cada generación se mide por lo que logró conservar y por lo que osó ganar.
Sus súbditos son casi todos humanos, y su identidad se construye sobre la memoria de sus linajes y de las guerras que superaron, a diferencia de los imperios pluriespecie.
<em>Pendiente de completar: ubicación, sistema político, economía y relaciones.</em>`],
['grimvar','Grimvar','⛏️ Reino enano',`Un reino tallado en las profundidades de las montañas, célebre por sus fortalezas pétreas, sus minas y la maestría de sus artesanos y herreros. Sus salas de asamblea tienen bóvedas que se sostienen sin una sola columna.
Los enanos salieron de la roca de las grandes cordilleras y excavaron ciudades bajo ellas, con casas que son a la vez familias, gremios y repúblicas, y con archivos tallados en basalto que guardan registros anteriores al calendario común. Entre sus figuras más queridas está Kaldur Orren, la Piedra que Recuerda, que gobernó cuatrocientos años y legó una vara de medir que los mercaderes del mundo entero adoptaron sin preguntar su origen.
Es un reino de una sola especie, y su vida pública gira en torno al oficio, al linaje y a la obra bien hecha.
<em>Pendiente de completar: ubicación, sistema político, economía y relaciones.</em>`],
['tharzug','Tharzug','🪓 Reino orco',`Un reino de clanes guerreros y territorios agrestes, donde la fuerza, el honor tribal y la supervivencia determinan el prestigio de sus líderes. Sus tierras son altas, abiertas y duras, y sus fraguas viajan en carros.
Los orcos llegaron a la historia a caballo, organizados en fuegos: familias extensas reunidas en torno a una hoguera, aliadas cada año en una asamblea al aire libre donde se resuelven disputas y se pactan matrimonios. Su ley es oral, y sus jueces no pueden sentenciar ningún asunto que afecte a su propia familia. Tharzug es la unión de esos clanes en un reino, y el prestigio se mide en hazañas, en palabra cumplida y en la capacidad de proteger a la propia gente.
Fue un orco, Sarn Vokh, quien puso fin a la primera gran guerra entre elfos y enanos obligándolos a comerciar antes de hablar, y Tharzug conserva esa doble reputación de guerrero y de árbitro. No todos sus habitantes viven para la guerra: hay comerciantes, artesanos, médicos y estudiosos.
<em>Pendiente de completar: ubicación, sistema político, economía y relaciones.</em>`]]},
{id:'creencias',t:'Creencias',i:'Cuatro fes, cuatro maneras de entender a los principios.',p:[
['cuaternismo','Orden del Cuaternismo','Concordancia de los cuatro',`La Orden del Cuaternismo es la religión más extendida y la que más templos posee. Nació del reconocimiento de que [[physeon|Phýseon]], [[elyr|El’yr]], [[aphanes|Aphanes]] y [[nevar|Nev’ar]] dependen entre sí, y honra a los cuatro por igual: cada templo tiene cuatro altares de la misma altura. Para sus fieles, la veneración exclusiva de un solo principio conduce a excesos, y la armonía exige honrarlos a todos.\nSe atribuye su fundación a Selvaine Ardoch, la Primera Concordante, que fue sepulturera y partera. Celebra cuatro festividades anuales (nacimientos, obras, finales y muertos), sostiene hospicios y archivos, tolera la magia pero condena el cruce del umbral, y varios de sus templos respaldaron el Cierre. Su emblema es un sol dorado de cuatro puntas mayores.`],
['custodia','La Custodia','El mundo se confió a los hombres',`La Custodia sostiene que el mundo fue puesto en manos de los mortales para que lo cuiden y lo moldeen, y que depender de los dioses para cada decisión es abandonar esa tarea. Cree en las deidades, pero reza poco y trabaja mucho; es liberal y mundana, valora la responsabilidad por las consecuencias y no ve virtud en la austeridad.\nSus templos son talleres, aulas y casas de enfermos, con un día semanal de cuentas. Venera como ejemplos a Ysolde Terrin, Ysmerai Dohl y Kaldur Orren, acepta la magia como artesanía legítima y prefiere regular la [[muerte|Magia de la Muerte]] antes que prohibirla. Su emblema es una luna creciente de plata.`],
['devocionismo','Devocionismo','Vivir con los dioses',`El Devocionismo sostiene que la única forma correcta de vivir es en constante relación con los dioses. Su práctica combina meditación al amanecer y al anochecer, oración repartida durante la jornada, ayunos y estudio continuo de los dominios de cada principio. Reconoce que el [[karma|Karma]] no premia la fe, pero cree que la devoción educa la conducta.\nSus templos se parecen a monasterios, dirigidos por Venerables, y veneran a Halvena Dreisk como prueba de que la gracia responde a la constancia. Ve el contacto con los dominios como un acto sagrado que se hace con oración, y prohíbe toda práctica de la Muerte. Su emblema es una espada envuelta en llamas.`],
['naturalismo','Naturalismo','El orden natural no se corrige',`El Naturalismo sostiene que la interacción de los cuatro principios es el orden natural y que el derecho de actuar sobre los dominios pertenece solo a los dioses; la magia es, para sus fieles, un robo. Es la religión más expansionista, arraigada en algunos ejércitos que la extienden por conquista.\nSus capellanes presiden tribunales de abjuración, donde los hechiceros de un territorio conquistado renuncian a su arte y entregan sus instrumentos. Honra a los cuatro principios como ciclo, entierra a sus muertos bajo árboles y prefiere la herbolaria. Su fundador fue Ewald Therran, y su doctrina militar es obra de la mariscal Brenna Voss. Su emblema es un árbol dentro de una corona de hojas.`]]},
{id:'razas',t:'Razas',i:'Todas las razas y seres del mundo. Las razas exclusivas requieren aprobación administrativa.',p:[
['humanos','Humanos','La más numerosa',`La última de las grandes razas en expandirse, pero la más numerosa y extendida. Su capacidad de adaptación les permitió asentarse en casi cualquier entorno y crear reinos, ciudades y comunidades de enorme diversidad. No destacan por la longevidad ni por capacidades sobrenaturales, sino por su facilidad para aprender y reorganizar sus sociedades.\nSu expansión ha dado grandes civilizaciones y también conflictos por territorios antes habitados por otros pueblos.`],
['elfos','Elfos','Memoria de siglos',`Una de las razas más antiguas del mundo. Viven varios siglos, pero no son inmortales ni físicamente superiores. Su longevidad les permite conservar conocimientos y recuerdos durante generaciones, y ha marcado sus tradiciones y su relación con la historia.\nSus sociedades van de comunidades aisladas a reinos consolidados; valoran la estabilidad y la preservación de sus costumbres, aunque también han protagonizado guerras y disputas políticas.`],
['enanos','Enanos','Artesanos de la roca',`Raza antigua y numerosa, reconocida por su habilidad artesanal, su ingeniería y su dominio de la construcción. Habitan ciudades subterráneas, fortalezas montañosas y grandes asentamientos en la superficie.\nLa minería es importante, pero no define su cultura: han desarrollado metalurgia, arquitectura, alquimia y maquinaria, y algunas de sus obras siguen funcionando siglos después de construidas.`],
['orcos','Orcos','Disciplina y honor',`Raza numerosa extendida por llanuras, montañas y territorios fronterizos, de constitución robusta. Muchos pueblos orcos valoran la disciplina, el honor y la superación personal, lo que ha dado sociedades de estructura militar compleja.\nNo todos viven para la guerra: también hay comerciantes, artesanos, médicos, gobernantes y estudiosos.`],
['vampiros','Vampiros','La sangre alterada',`Raza sobrenatural surgida de una antigua alteración de la sangre y la carne, atribuida a un mortal que se resistió a la muerte. Necesitan sangre y pueden transmitir su condición mediante mordida, aunque la transformación no siempre es inmediata ni inevitable.\nExisten vampiros convertidos y Vampiros Puros, nacidos de linajes; entre los más antiguos están los Alfas Originales, algunos capaces de adoptar la forma de enormes murciélagos. La luz solar los debilita y la plata puede dañarlos. Su enemistad con los licántropos es una de las más antiguas del mundo.`],
['hbestia','Hombres bestia','Linajes de maldiciones',`Raza diversa cuyos linajes presentan rasgos de distintas criaturas. Su origen se vincula con antiguas alteraciones y maldiciones heredadas, aunque no todos comparten la misma explicación. Viven en clanes, aldeas y comunidades aisladas; algunos comercian con otros pueblos y otros se ocultan por la persecución.\nLos licántropos son uno de sus linajes más conocidos: se transforman con intensidad variable y mantienen una enemistad ancestral con los vampiros.`],
['gigantes','Gigantes','Los primeros',`Una de las razas más antiguas, anterior a las civilizaciones actuales. Su tamaño y su fuerza son enormes, pero son incapaces de reproducirse, y su población ha menguado hasta unos pocos individuos, sobre todo en regiones montañosas y polares.\nSus antiguos territorios conservan ruinas colosales, algunas levantadas alrededor de los restos de sus muertos.`],
['ciclopes','Cíclopes','Un solo ojo',`Humanoides de gran tamaño con un único ojo; raza natural poco numerosa, repartida en pequeños grupos por montañas, valles y regiones rurales. Muchos llevan vidas aisladas de pastoreo, agricultura o artesanía.\nSu apariencia suele inspirar temor, pero no son agresivos por naturaleza.`],
['ogros','Ogros','Fuerza y oficio',`Raza natural de gran tamaño y fuerza, presente sobre todo en regiones apartadas de las grandes civilizaciones. Se organizan en familias, tribus o pequeñas comunidades.\nAlgunos grupos viven del combate y el saqueo; otros, de la agricultura, la artesanía o el comercio. Su inteligencia no difiere necesariamente de la de otras razas.`],
['hadas','Hadas','Pequeñas y aladas',`Raza natural de pequeño tamaño, con alas y capacidad de volar. Habitan bosques, valles y regiones apartadas, en comunidades de tamaño variable. Poseen aptitudes mágicas innatas, de intensidad dependiente de cada individuo.\nNo todas son pacíficas ni comparten las mismas costumbres.`],
['duendes','Duendes','Ingenio y adaptación',`Raza de baja estatura, extendida por bosques, cuevas, ruinas y asentamientos rurales. Es relativamente abundante, aunque en comunidades pequeñas. Destacan por su ingenio y su habilidad para aprovechar lo que otras razas desechan.\nPueden ser artesanos, comerciantes, recolectores o ladrones; no existe una cultura duende unificada.`],
['sirenas','Sirenas y tritones','Pueblos del agua',`Pueblos acuáticos presentes en mares, costas, grandes lagos y ríos profundos, en asentamientos aislados y ciudades sumergidas. Pueden permanecer en tierra durante periodos limitados, pero su vida depende del agua.\nAlgunas comunidades comercian con los pueblos terrestres; otras evitan todo contacto con la superficie.`],
['centauros','Centauros','Torso humano, cuerpo equino',`Raza natural de torso humano y cuerpo equino. Viven en llanuras, bosques y valles, en comunidades nómadas o asentamientos permanentes. Su población es considerable pero dispersa, y sus costumbres varían según la región.`],
['minotauros','Minotauros','Hijos de una maldición',`Individuos transformados por maldiciones que alteran profundamente su cuerpo, con rasgos humanoides y bovinos. No nacen como tales ni son una especie natural: cada transformación depende de la maldición que la provoca.\nAlgunos conservan su personalidad y sus recuerdos; otros sufren alteraciones mentales irreversibles.`],
['gargolas','Gárgolas','Piedra que recuerda',`Criaturas de cuerpo pétreo, naturales o creadas mediante magia para custodiar construcciones y lugares. Su resistencia les permite permanecer inmóviles durante años, confundidas con estatuas.\nLas naturales son poco comunes; las artificiales dependen de sus creadores. Algunas permanecen atadas al lugar que protegen y otras forman pequeñas comunidades.`],
['golems','Golems','Seres artificiales',`Seres artificiales creados mediante magia, alquimia o técnicas antiguas, de piedra, metal, arcilla o madera. La mayoría cumple una función específica, como custodiar lugares o realizar trabajos.\nAlgunos desarrollan inteligencia y voluntad propias, aunque es excepcional. No se reproducen: su número depende de los creadores capaces de fabricarlos.`],
['muertosv','Muertos vivientes','Cadáveres reanimados',`Cadáveres reanimados, en su mayoría mediante la [[muerte|Magia de la Muerte]]. Casi todos carecen de voluntad y necesitan un hechicero, un ritual o un vínculo mágico; algunos conservan recuerdos y personalidad.\nSu existencia está prohibida o perseguida en numerosos territorios.`],
['inmortales','Inmortales','Los que dejaron de envejecer',`Individuos que dejaron de envejecer o de estar sujetos a la muerte natural por circunstancias desconocidas. No son una raza: cada uno llegó a su condición por un camino distinto. Son extremadamente escasos y no pueden reproducirse.\nPueden vivir siglos, y cada uno guarda condiciones particulares que pueden conducir a su muerte definitiva.`],
['exanimes','Exánimes','Entre la vida y la muerte',`Seres cuya existencia permanece suspendida entre la vida y la muerte. Algunos fueron mortales alterados por la Magia de la Muerte; el origen de otros es desconocido.\nSon extremadamente raros y no forman comunidades conocidas. Sus cuerpos pueden funcionar sin órganos vitales.`],
['abisales','Abisales','Donde el mundo se altera',`Entidades excepcionales ligadas a regiones donde la realidad presenta alteraciones inexplicables. Se ignora si son una especie, seres de otro lugar o manifestaciones de fenómenos desconocidos.\nSu presencia altera el entorno con efectos ajenos a las disciplinas mágicas conocidas, y los encuentros con ellos son rarísimos.`],
['serafines','Serafines','Voluntad de los principios',`Entidades sobrenaturales vinculadas a los Dioses Primordiales, como creaciones directas o manifestaciones de su voluntad. No son una raza mortal ni tienen sociedad propia.\nCada uno cumple un propósito particular, sus capacidades superan las de cualquier hechicero y sus apariciones se asocian a acontecimientos de importancia sobrenatural.`]]},
{id:'criaturas',t:'Criaturas',i:'Bestias, monstruos y prodigios de los rincones del mundo. Pendiente de completar: registros de distribución.',p:[
['dragones','Dragones','Colosos alados',`Reptiles colosales y alados, entre las criaturas más temidas del mundo. Su tamaño, su longevidad y su aliento varían según la especie; la mayoría anida en cumbres y cavernas profundas, y los más grandes se cuentan casi como fenómenos naturales.\nLos relatos los asocian con tesoros y ruinas antiguas, pero su comportamiento depende más de cada individuo que de la leyenda.`],
['gargolasc','Gárgolas','Guardianes de piedra',`Guardianes de aspecto grotesco y alado que a menudo coronan templos y fortalezas. Su origen, natural o mágico, se describe entre las razas: véase [[gargolas|Gárgolas]].`],
['basiliscos','Basiliscos','Mirada y veneno',`Reptiles de mirada y veneno letales que habitan ruinas, cuevas y pantanos. Su sola presencia basta para despoblar una zona. Los cazadores usan espejos y fuego, con resultados desiguales.`],
['grifos','Grifos','Reyes de las alturas',`Criaturas con cuerpo de león y cabeza y alas de águila, cazadoras de las alturas. Pueden domesticarse con paciencia, aunque casi nunca del todo, y algunos pueblos los emplean como monturas o vigías.`],
['fenix','Fénix','Fuego que renace',`Ave de plumaje de fuego que renace de sus propias cenizas. Es rarísima, y sus apariciones se asocian a finales y comienzos. No suele atacar, pero arde con lo que la amenaza.`],
['wendigos','Wendigos','Hambre y hielo',`Seres demacrados de los bosques helados y de las tierras de hambruna, cazadores insaciables ligados al frío y al hambre. Los relatos los tratan menos como bestias que como maldiciones hechas carne.`],
['yetis','Yetis','Señores de las cumbres',`Criaturas de pelaje blanco y gran fuerza que habitan cumbres y glaciares. Esquivos, evitan a los viajeros salvo que se invada su territorio.`],
['sasquatch','Sasquatch','Gigantes del bosque',`Criaturas corpulentas y peludas de los bosques profundos, de costumbres solitarias. Sus huellas se encuentran con más frecuencia que ellos mismos.`],
['mandragoras','Mandrágoras','Raíces que gritan',`Plantas de raíz con forma humanoide que crecen en la tierra de antiguos cementerios y campos de batalla. Su grito puede aturdir o matar, y se emplean con cuidado en la herbolaria y la alquimia.`],
['gorgonas','Gorgonas','La mirada de piedra',`Mujeres de cabellera de serpientes cuya mirada convierte en piedra. Habitan ruinas apartadas, y muchas estatuas antiguas se les atribuyen.`],
['hidras','Hidras','Muchas cabezas',`Monstruos de varias cabezas que habitan pantanos y aguas estancadas. Se dice que, cuando se corta una cabeza, pueden brotar otras, y los cazadores prefieren el fuego.`],
['krakens','Krakens','Terror de los mares',`Criaturas marinas colosales de múltiples tentáculos, que habitan los mares profundos y hunden navíos. Los marinos los consideran un riesgo real en las rutas lejanas.`],
['manticoras','Mantícoras','Yermos y desiertos',`Bestias con cuerpo de león, rostro humanoide y cola de escorpión, que acechan en yermos y desiertos.`],
['huargos','Huargos','Lobos de las fronteras',`Lobos enormes, astutos y de comportamiento de manada, que acechan bosques y fronteras. No deben confundirse con los licántropos, que son un linaje de hombres bestia.`]]},
{id:'objetos',t:'Objetos',i:'Armas, armaduras, provisiones, herramientas y moneda del mundo. Filtra por categoría y combina etiquetas.',p:[
['espada','Espada','Hoja recta de doble filo',`Hoja recta de doble filo y longitud media, con guarda, mango y pomo. Es el arma de caballeros, oficiales y espadachines de oficio, y su forja recibe más cuidado que ninguna otra: hojas bruñidas, guardas grabadas y pomos con el emblema de una casa o un taller.
<b>Ventajas.</b> Corta, estoquea y desvía con una misma hoja, sirve en duelo y en formación, y su equilibrio permite combates largos.
<b>Desventajas.</b> Exige años de entrenamiento, es cara de forjar y apenas rasca las placas completas.`,'Armas',['Arma blanca','Una mano']],
['sable','Sable','Hoja curva de filo único',`Hoja curva de filo único, más ligera que la espada y pensada para cortes largos. Es el arma de jinetes, corsarios y guardias de ciudad, con guardas de filigrana y vainas lacadas.
<b>Ventajas.</b> Se desenvaina rápido y rinde desde la montura, donde el corte aprovecha el impulso del caballo.
<b>Desventajas.</b> Su curva resta eficacia a la estocada, y contra placas y malla gruesa su filo apenas hiere.`,'Armas',['Arma blanca','Una mano']],
['hacha','Hacha','Filo en media luna',`Cabeza de metal con filo en media luna sobre un mango de madera: la más antigua y sencilla de las armas de filo. La llevan leñadores, mineros, soldados de leva y guerreros de tribus que tallan en ella el símbolo de su clan.
<b>Ventajas.</b> Concentra la fuerza en un solo filo que rompe escudos y abre yelmos; es barata y sirve como herramienta.
<b>Desventajas.</b> Su alcance es corto, el peso en la cabeza dificulta recuperar la guardia y puede quedar atascada.`,'Armas',['Arma blanca','Una mano','Herramienta']],
['daga','Daga','Hoja corta y discreta',`Hoja corta de doble filo y punta aguda, de entre un palmo y un antebrazo. Es el arma de quienes no pueden permitirse otra o prefieren que no se sepa que la llevan, y se oculta en la bota o en la manga.
<b>Ventajas.</b> Discreta y rápida, rinde en espacios cerrados, forcejeos y juntas de armadura.
<b>Desventajas.</b> Su alcance es mínimo y obliga a acercarse demasiado a un adversario armado con algo más largo.`,'Armas',['Arma blanca','Una mano']],
['hoz','Hoz','Herramienta convertida en arma',`Herramienta agrícola de hoja en media luna y mango corto, convertida en arma por campesinos alzados, cazadores de monstruos con pocos recursos y comunidades que la ven como símbolo del final de los ciclos.
<b>Ventajas.</b> Su curva engancha escudos y corta por detrás de una defensa, y pasa por herramienta en cualquier mano.
<b>Desventajas.</b> Su hoja delgada se rompe contra el metal, su alcance es corto y contra armaduras resulta casi inútil.`,'Armas',['Arma blanca','Herramienta']],
['glaive','Glaive','Hoja larga sobre un asta',`Arma de asta con una hoja larga y ligeramente curva, semejante a un cuchillo enorme montado en un mango. La usan guardias de palacio, tropas de línea y escoltas, y su aspecto elegante la hace habitual en las ceremonias.
<b>Ventajas.</b> Combina el alcance de la lanza con el corte de la espada y resulta cómoda en formación cerrada.
<b>Desventajas.</b> Pesa para su tamaño, exige espacio y es incómoda en callejones e interiores.`,'Armas',['Arma blanca','Arma de asta','Dos manos']],
['maza','Maza','Fuerza sin filo',`Mango con cabeza de metal de aristas, flanges o púas, cuya fuerza no depende del filo. La llevan quienes se enfrentan a oponentes con armadura, y muchos sanadores y oficiantes por su simbolismo de autoridad sin sangre.
<b>Ventajas.</b> Transmite el golpe a través de la armadura, no se embota y deja libre la otra mano para el escudo.
<b>Desventajas.</b> Alcance corto, golpes previsibles y poca eficacia contra enemigos sin armadura que la esquivan.`,'Armas',['Contundente','Una mano']],
['martillo','Martillo de guerra','Cabeza plana y pico',`Herramienta de forja convertida en arma, con cabeza plana de impacto en un lado y un pico en el otro. Es la favorita de enanos, herreros y soldados que combaten contra enemigos acorazados.
<b>Ventajas.</b> Abolla placas con la cabeza y las perfora por las juntas con el pico; su mango largo da palanca.
<b>Desventajas.</b> Pesado y lento, cansa en combates largos y el pico puede tardar en liberarse.`,'Armas',['Contundente','Una mano','Herramienta']],
['garrote','Garrote','La más antigua de las armas',`Pieza de madera dura, a veces con nudos o clavos, y la más antigua y sencilla de las armas. La empuñan campesinos, pastores, vigilantes nocturnos y asaltantes de camino.
<b>Ventajas.</b> Barato, fácil de improvisar y permite someter sin matar.
<b>Desventajas.</b> Poca fuerza contra armaduras, se astilla y su alcance es corto.`,'Armas',['Contundente','Una mano']],
['baston','Bastón','Palo largo y foco de magos',`Largo palo de madera de la altura de un hombre o más, para caminar, defenderse y concentrar la atención. Es el arma de viajeros, ermitaños y practicantes de magia, que lo graban o engastan como foco.
<b>Ventajas.</b> Golpea con ambos extremos, mantiene a distancia y pasa inadvertido.
<b>Desventajas.</b> Daña poco y su madera puede partirse bajo el acero.`,'Armas',['Contundente','Arma de asta','Dos manos']],
['lanza','Lanza','Asta con punta de metal',`Asta larga con punta de metal para clavar a distancia; la más común entre las armas de infantería, de milicias, cacerías y caballería pesada. Las de ceremonia llevan borlas y bandas de color.
<b>Ventajas.</b> Mantiene al enemigo lejos, es barata y varias juntas forman un muro difícil de romper.
<b>Desventajas.</b> Si el enemigo se acerca, estorba; el asta puede cortarse y en interiores es incómoda.`,'Armas',['Arma de asta','Dos manos']],
['jabalina','Jabalina','Lanza corta para arrojar',`Lanza corta y ligera concebida para ser arrojada, con asta delgada y punta de metal templado. La llevan soldados ligeros, cazadores y escaramuzadores, que cargan varias a la vez.
<b>Ventajas.</b> Ataca a distancia sin armadura pesada y atraviesa escudos ligeros.
<b>Desventajas.</b> Se lanza una sola vez, alcanza menos que un arco y apenas penetra armaduras pesadas.`,'Armas',['Arrojadiza','A distancia','Arma de asta']],
['alabarda','Alabarda','Hacha, pico y lanza',`Arma de asta que reúne hoja de hacha, pico y punta de lanza en una sola cabeza, usada por guardias, soldados de leva e infantes que deben enfrentar caballería y armaduras. Las ceremoniales se usan en palacios y portones.
<b>Ventajas.</b> Corta, perfora y engancha, lo que la hace útil para descabalgar jinetes y abrir armaduras.
<b>Desventajas.</b> Pesada y lenta, exige entrenamiento y es incómoda en espacios cerrados.`,'Armas',['Arma de asta','Arma blanca','Dos manos']],
['tridente','Tridente','Tres puntas de horquilla',`Asta con tres puntas en forma de horquilla, de uso antiguo en la pesca y después en el combate de pescadores, marinos, guardias de puerto y luchadores de arena.
<b>Ventajas.</b> Multiplica las probabilidades de herir y permite atrapar armas o enredar redes.
<b>Desventajas.</b> Penetra peor que una lanza, las armaduras desvían sus puntas y pocos dominan su técnica.`,'Armas',['Arma de asta','Dos manos']],
['arco','Arco','Flechas a gran distancia',`Vara flexible con cuerda tensada que lanza flechas a gran distancia; los hay cortos, largos y compuestos. Es el arma de cazadores, exploradores y arqueros de ejército, con carcaj de cuero y brazal en el antebrazo.
<b>Ventajas.</b> Ofrece alcance, precisión y cadencia, y un grupo de arqueros domina un campo de batalla.
<b>Desventajas.</b> Exige años de práctica, depende del clima y pierde fuerza contra armaduras pesadas.`,'Armas',['A distancia','Dos manos']],
['ballesta','Ballesta','Virotes de gran fuerza',`Arco montado sobre un soporte con un mecanismo de disparo que mantiene la cuerda tensada hasta liberarla; dispara virotes cortos y pesados. La usan soldados de guarnición, guardias de muralla y compañías contratadas.
<b>Ventajas.</b> Se aprende pronto y sus virotes atraviesan armaduras ligeras y medias.
<b>Desventajas.</b> Recargarla es lento, es pesada y cara, y la humedad estropea sus mecanismos.`,'Armas',['A distancia','Dos manos']],
['honda','Honda','Piedra y plomo',`Tira de cuero con una bolsa central que se hace girar para lanzar piedras o proyectiles de plomo. Es el arma de pastores, de muchachos de aldea y de tropas auxiliares.
<b>Ventajas.</b> Barata, ligera y silenciosa; su munición se encuentra en cualquier camino.
<b>Desventajas.</b> Exige mucha práctica y apenas daña a un enemigo con armadura.`,'Armas',['A distancia','Arrojadiza']],
['cerbatana','Cerbatana','Dardos silenciosos',`Tubo largo y hueco de madera, caña o metal por el que se sopla un dardo pequeño. Es el arma silenciosa de cazadores de regiones selváticas, asesinos y exploradores, con dardos que pueden llevar toxinas o sedantes.
<b>Ventajas.</b> Silenciosa y fácil de ocultar, permite atacar sin ser visto.
<b>Desventajas.</b> Su alcance y su fuerza son reducidos y depende por completo de las toxinas.`,'Armas',['A distancia']],
['arpon','Arpón','Punta barbada y cuerda',`Lanza de punta barbada atada a una cuerda, concebida para cazar presas de gran tamaño. Es el arma de balleneros, pescadores de aguas profundas y cazadores de criaturas marinas, con las marcas de la tripulación grabadas en el asta.
<b>Ventajas.</b> Las barbas impiden que la presa escape y la cuerda permite recuperar lo clavado.
<b>Desventajas.</b> Pesado y difícil de recuperar si la cuerda se corta; en tierra resulta poco práctico.`,'Armas',['A distancia','Arma de asta','Herramienta']],
['chakram','Chakram','Anillo de filo exterior',`Disco o anillo metálico de borde exterior afilado, que se lanza con un giro de muñeca o se empuña como cuchilla circular. Es un arma exótica, de origen lejano, usada por guerreros especializados y artistas de combate.
<b>Ventajas.</b> Compacto y rápido, un lanzamiento hábil puede rebotar y alcanzar varios blancos.
<b>Desventajas.</b> Exige entrenamiento especializado y es difícil de reponer; contra armadura apenas hiere.`,'Armas',['Arrojadiza','A distancia','Arma blanca']],
['tonfa','Tonfa','Bastón de empuñadura lateral',`Bastón corto con una empuñadura lateral que permite hacerlo girar sobre el antebrazo y golpear con ambos extremos. Lo usan guardias de ciudad, escoltas y maestros de combate, casi siempre por pares.
<b>Ventajas.</b> Protege el antebrazo y pasa de la defensa al ataque sin pausa; es útil para reducir sin matar.
<b>Desventajas.</b> Alcance muy corto y casi inútil contra armaduras o hojas largas.`,'Armas',['Contundente','Una mano']],
['latigo','Látigo','Cuero trenzado',`Correa larga de cuero trenzado con un extremo delgado que chasquea al cortar el aire. Herramienta de pastores y domadores antes que arma, se convierte en instrumento de control en manos de cazadores y guerreros.
<b>Ventajas.</b> Largo alcance, ataque rápido y capacidad de enredar armas o miembros.
<b>Desventajas.</b> Causa heridas superficiales, es difícil de controlar y exige espacio libre.`,'Armas',['Una mano','Herramienta']],
['guanteletes','Guanteletes','Puños de acero',`Guantes reforzados con placas de metal que protegen mano y antebrazo y permiten golpear con fuerza; forman parte de la armadura, pero también sirven como arma de puños. Los de ceremonia se sobredoran para actos oficiales.
<b>Ventajas.</b> Protegen de los cortes, permiten agarrar hojas y convierten los puñetazos en golpes devastadores.
<b>Desventajas.</b> Obligan a pelear a muy corta distancia, añaden peso y reducen la destreza fina.`,'Armas',['Contundente','Defensa']],
['armaduras','Armaduras','Cuero, malla y placas',`Conjunto de piezas que protegen el cuerpo, desde el cuero endurecido y la malla hasta el arnés de placas. La elección depende del oficio, la bolsa y el terreno, y las de las casas nobles llevan grabados de linaje o devoción.
<b>Ventajas.</b> Reduce de forma notable el daño de cortes y flechas y permite resistir en formación.
<b>Desventajas.</b> Pesa, cansa, es cara de forjar y mantener, y ninguna protege del todo de un golpe contundente.`,'Protección',['Defensa']],
['escudo','Escudo','Madera, cuero y metal',`Pieza de madera, cuero y metal que se porta en el brazo para desviar golpes y proyectiles; los hay redondos, largos y pequeños, a menudo pintados con el emblema de su dueño.
<b>Ventajas.</b> Protege el cuerpo, permite formaciones cerradas y sirve también para golpear.
<b>Desventajas.</b> Ocupa una mano, pesa y la madera se astilla bajo golpes repetidos.`,'Protección',['Defensa','Una mano']],
['odres','Odres','Cuero para el camino',`Bolsas de cuero cosido para transportar agua, vino o cerveza en viajes largos. Marineros, soldados y caravaneros los llevan colgados al hombro o a la cintura, y los de lujo van repujados.
<b>Ventajas.</b> Ligeros y resistentes, no se rompen con los golpes y se adaptan a cualquier espacio.
<b>Desventajas.</b> El cuero deja un sabor persistente, se pudre si no se seca y un pinchazo vacía el contenido.`,'Viaje y herramientas',['Herramienta','Bebida']],
['brujula','Brújula','Aguja imantada',`Aguja imantada sobre una caja pequeña que señala siempre el mismo rumbo. Es una herramienta de navegantes y cartógrafos, apreciada en el mar y en los bosques cerrados donde faltan referencias.
<b>Ventajas.</b> Orienta con niebla, noche o lluvia.
<b>Desventajas.</b> Falla cerca del hierro o de ciertas piedras, es frágil y no sustituye a un buen mapa.`,'Viaje y herramientas',['Navegación','Herramienta']],
['mapas','Mapas','Pergamino y cartografía',`Planos dibujados a mano sobre pergamino que representan costas, caminos, ciudades y fronteras. Los mejores son obra de cartógrafos que viajaron, y los más antiguos mezclan observación con leyenda. <em>Pendiente de completar: mapas oficiales del canon.</em>
<b>Ventajas.</b> Permiten planear rutas y evitar peligros.
<b>Desventajas.</b> Se quedan obsoletos, muchos son erróneos o falsos y su posesión puede levantar sospechas en una frontera.`,'Viaje y herramientas',['Navegación']],
['cuerda','Cuerda','Cáñamo trenzado',`Cuerda de cáñamo trenzado, imprescindible en barcos, minas, escaladas y campamentos. Hay cuerdas finas para trampas y gruesas para izar cargas.
<b>Ventajas.</b> Resistente y versátil, sirve para trepar, atar y remolcar.
<b>Desventajas.</b> Se pudre con la humedad, pesa en cantidad y puede quemarse o cortarse.`,'Viaje y herramientas',['Herramienta']],
['antorcha','Antorcha','Luz de campamento',`Tea de madera envuelta en trapos con brea o grasa que da luz y calor durante una hora o dos. Es la iluminación de subterráneos, caminos nocturnos y asedios.
<b>Ventajas.</b> Barata, ilumina y sirve de arma improvisada o de señal.
<b>Desventajas.</b> Se apaga con el viento, delata la posición y puede provocar incendios.`,'Viaje y herramientas',['Herramienta']],
['hidromiel','Hidromiel','Miel fermentada',`Bebida dulce de miel fermentada, de color dorado y aroma de flores, tradicional de festividades, bodas y banquetes de invierno. Se sirve tibia en copas de asta o de barro. <em>Pendiente de completar: regiones productoras.</em>
<b>Ventajas.</b> Reconforta, calienta y se conserva bien.
<b>Desventajas.</b> Es traicionera por su dulzor y adormece más de lo que aparenta.`,'Alimentos y bebidas',['Bebida','Alcohol']],
['cerveza','Cerveza','Cebada fermentada',`Bebida de cebada fermentada, la más común en tabernas y posadas, de color ámbar o negro y espuma espesa. Acompaña comidas, jornadas de trabajo y celebraciones.
<b>Ventajas.</b> Barata, nutritiva y más segura que el agua estancada.
<b>Desventajas.</b> Se agria con el calor y su abuso embota la mente.`,'Alimentos y bebidas',['Bebida','Alcohol']],
['vino','Vino','Uva fermentada',`Bebida de uva fermentada, signo de mesa noble y de mercado, con variedades que van del tinto espeso al blanco ligero. Los grandes caldos se guardan en bodegas y se heredan.
<b>Ventajas.</b> Acompaña banquetes, se conserva años y es objeto de comercio.
<b>Desventajas.</b> Cuesta, se avinagra mal almacenado y el exceso nubla el juicio.`,'Alimentos y bebidas',['Bebida','Alcohol']],
['pan','Pan','Alimento básico',`Alimento básico de hogares, caminos y campamentos, hecho de harina de cereal, agua y fermento. Varía en dureza, color y tamaño según el grano y la región.
<b>Ventajas.</b> Nutre, es barato y aguanta varios días.
<b>Desventajas.</b> Se endurece y enmohece con la humedad, y un solo pan no sustenta un viaje largo.`,'Alimentos y bebidas',['Alimento']],
['dinero','Dinero','Monedas y crédito',`Monedas de metal acuñadas por los imperios y los mercaderes, que circulan junto a pagarés y créditos en los grandes puertos. Su valor depende del metal, del peso y del crédito de quien las emite. <em>Pendiente de completar: denominaciones y equivalencias.</em>
El oro de las casas nobles, la plata de los gremios y el cobre de los mercados de aldea conviven en una misma bolsa, y los cambistas viven de convertir unas en otras.
Compra servicios, lealtades y silencios, pero pesa, llama la atención de los ladrones y pierde valor fuera del territorio que la acuñó.`,'Dinero y comercio',['Dinero']],
['faroles','Faroles','Luz protegida',`Lámparas de metal y vidrio con una llama protegida, que se llevan en la mano, se cuelgan de postes o se enganchan en las sillas de montar. Iluminan calles, muelles, minas y campamentos, y los de las casas nobles llevan cristales de colores y herrajes labrados.
<b>Ventajas.</b> Dan una luz estable que no se apaga con el viento, duran mucho más que una antorcha y permiten leer y trabajar de noche.
<b>Desventajas.</b> Son frágiles, necesitan aceite o sebo y delatan la posición de quien los porta.`,'Viaje y herramientas',['Herramienta']],
['yelmo','Yelmos','Protección para la cabeza',`Piezas de metal que protegen la cabeza, desde el casco abierto de cuero reforzado hasta el yelmo cerrado con visera. Los de los caballeros llevan cimeras y emblemas; los de los soldados rasos, solo el color del cuerpo al que sirven.
<b>Ventajas.</b> Evitan golpes mortales en el cráneo y desvían flechas y cortes.
<b>Desventajas.</b> Limitan la vista y el oído, acaloran y su peso cansa el cuello en jornadas largas.`,'Protección',['Defensa']],
['rodela','Rodela','Escudo pequeño y redondo',`Escudo pequeño y redondo de madera o metal, que se porta en el antebrazo o se agarra por el centro. Es el favorito de espadachines, escaramuzadores y guardias que necesitan moverse deprisa.
<b>Ventajas.</b> Ligera y ágil, desvía golpes y deja espacio para combatir con soltura.
<b>Desventajas.</b> Protege poco el cuerpo y no resiste flechas ni cargas pesadas.`,'Protección',['Defensa','Una mano']],
['escudotorre','Escudo de torre','Muro portátil',`Escudo grande y rectangular que cubre casi todo el cuerpo, usado por infantería de línea, defensores de murallas y soldados de asedio, a veces con el estandarte pintado.
<b>Ventajas.</b> Ofrece cobertura casi total y permite formar muros de escudos casi impenetrables.
<b>Desventajas.</b> Es muy pesado, limita la movilidad y exige una buena formación a su alrededor.`,'Protección',['Defensa','Dos manos']],
['zurron','Zurrón','Bolsa de viaje',`Bolsa de cuero o tela gruesa que se lleva colgada al hombro o al cinto, para provisiones, herramientas y pequeñas pertenencias. Pastores, mensajeros y viajeros lo llevan como compañero inseparable.
<b>Ventajas.</b> Barato, ligero y resistente, deja las manos libres y se adapta a cualquier camino.
<b>Desventajas.</b> No protege del agua si no se encera y su contenido queda a merced de los ladrones de bolsillo.`,'Viaje y herramientas',['Herramienta']]]},
{id:"magia",t:"Sistema mágico",i:"Cuatro disciplinas, un mismo caudal.",p:[
["principios","Principios generales","Cómo funciona la magia",`La magia es una disciplina aprendida: el oficio de actuar sobre los dominios de los cuatro principios, sin que estos concedan nada. Se alimenta del <b>caudal</b>, una reserva interna de vigor, y cansa según su complejidad: lo menor cuesta como subir unas escaleras, lo mayor como una pelea larga y lo exigente deja exhausto.
Solo lo extraordinario (transformaciones permanentes, ataduras de alma, resurrección) exige precios permanentes. Importan más la habilidad, la precisión, la experiencia y la preparación que la fuerza bruta.`],
["cuerpo","Magia del Cuerpo","Carne, sangre y huesos",`Actúa sobre la carne, la sangre, los huesos y los procesos biológicos. Cierra heridas, detiene hemorragias, fortalece cuerpos y, en sus formas mayores, transforma organismos y fija maldiciones hereditarias. No crea materia orgánica de la nada: acelera y guía procesos naturales, y necesita materia viva, comida y tiempo. No detiene el envejecimiento ni repara tejido muerto.`],
["alma","Magia del Alma","Identidad y presencias",`Actúa sobre la identidad, la voluntad, los recuerdos y las presencias espirituales. Permite sentir y expulsar presencias, influir sobre voluntades y, en sus formas mayores, poseer temporalmente o encerrar un alma en un objeto, con serios riesgos para quien la ejerce. No permite controlar libremente a otros ni determinar el destino de los muertos, que pertenece a Nev’ar y a [[edran|Edran Veyl]].`],
["muerte","Magia de la Muerte","El umbral",`Actúa sobre el proceso de morir, los cadáveres y el umbral: aliviar agonías, retrasar una muerte, conservar cuerpos o animar cadáveres simples. Los intentos de resurrección y la prolongación de la vida exigen precios permanentes, y volver no equivale a recuperar a la misma persona. Un alma ya juzgada solo regresa si [[nevar|Nev’ar]] lo permite. Está prohibida en numerosos territorios desde el Cierre.`],
["elemental","Magia Elemental","Materia y fenómenos",`Actúa sobre la materia inerte y los fenómenos físicos: tierra, piedra, agua, hielo, aire, fuego y electricidad. No crea materia ilimitada ni controla directamente a los seres vivos; los metales se calientan y se trabajan, pero no obedecen a distancia. Permite encantar objetos, trabajo que exige días junto a un artesano y que se desgasta con el uso.`]]}
];

const X={antes:`\nLos relatos más antiguos sitúan además una presencia que acompañó el primer aliento fuera del agua: la Madre. Un anciano de barba blanca, el Tejedor, enseñó a los gigantes que un hilo conserva lo que la memoria deja caer, y por eso sus cordones siguen colgando, ilegibles, en galerías vacías. Los gigantes dejaban además una piedra pequeña donde alguien había nacido o muerto.`,aurora:`\nCon los siglos aprendieron a convivir mejor de lo que cabía esperar. Enanos, orcos y humanos fundaron un reino que cobraba peaje en el único desfiladero practicable; regiones separadas por fiordos y bosques cerrados se unieron mediante matrimonios; los barcos abrieron rutas entre continentes. Una gigante de más de trescientos años se sentó una temporada entera en una feria a contar los niños nacidos ese año, y la cuenta, por alguna razón, no le salía.`,umbral:`\nEn mil años, las tres artes transformaron la vida de los mortales: los partos se salvaron, las epidemias dejaron de ser sentencias y los reyes se rodearon de consejeros que curaban o amenazaban con medios que ninguna espada alcanzaba. Los humanos, que viven pocos años, la abrazaron con urgencia. Una reina-maga remodeló el cuerpo de una guarnición amotinada, y sus descendientes, los minotauros, acabaron liberándose del linaje que los creó.`,templos:`\nLos templos acogían moribundos, resolvían herencias y conservaban archivos, pero también acumularon abusos: vidas compradas a campesinos pobres y galerías mineras trabajadas por cuerpos sin salario. Edran Veyl, hijo de sepultureros, asistió a más de diez mil muertes antes de preguntarse qué había al otro lado. A los ochenta y seis años murió en la cripta más profunda de su templo y volvió, pero no entero.\nLa noche de la caída del templo mayor, tres cronistas vieron una figura de humo atravesar la muralla; otros tres no vieron nada. A la mañana siguiente, un anciano de capucha vacía esperaba sentado frente a las puertas. Orsolya Kendrel murió a los setenta y un años, en su cama, y se dice que se oyeron pasos suaves junto a su puerta.`,mundo:`\nEl mundo actual es ocupado, ruidoso, mercantil y terco, con caminos donde un carretero se cruza con un sanador, un mercenario orco y una familia de pastores minotauros. Se venera a Halvena Dreisk, médica elevada por Phýseon, y a Brakka Sendar, que detuvo un ejército sin derramar su sangre. En un puerto del delta, una mujer con un niño dormido cruza la plaza, y nadie recordará su rostro.`};

Object.assign(X,{
eldoria:`
Eldoria es la tierra donde todo empezó: sus tierras altas vieron nacer a los gigantes y, a su pie, en los bosques húmedos, despertaron los elfos. Las calzadas de piedra que siguen las crestas, las galerías de cordones ilegibles y los montículos que señalan dónde alguien nació o murió son herencia de aquellos primeros pueblos, y hoy forman parte del paisaje cotidiano. Sobre ellas se alzan ciudades de todas las razas, con campanarios que fueron torres derruidas y plazas enmarcadas por arcos de otra edad.
La dispersión de los antiguos reinos élficos dejó un mosaico de cortes, arboledas y casas que se disputan la herencia de la canción original, y en este continente se levantaron muchos de los templos de la muerte clausurados tras el Cierre. Hoy, bajo la autoridad de [[marvayne|Marvayne]], conviven una corona aristocrática, villas con carta propia y ruinas que guías, custodios y anticuarios han convertido en oficio.
<em>Pendiente de completar: regiones y culturas concretas.</em>`,
valdren:`
Valdren es el mayor de los continentes y uno de los grandes centros de poder del mundo. Su geografía se ordena en torno a una gran cordillera, en cuyas raíces habitan los enanos y que protege al norte unas llanuras amplias y fértiles de clima templado, con ríos mansos, colinas de viñedos y olivares y estepas de pastoreo. En el interior, las tierras altas y las praderas abiertas son el territorio de los fuegos orcos.
Aquí nació la feria que selló la paz entre elfos y enanos, se abrió el desfiladero que financió durante siglos a un reino de peaje y se levantó la mayor ciudad de los muertos. Y aquí se formó la potencia que hoy ocupa casi todo el continente: [[ithravell|Ithravell]], con sus calzadas rectas, sus fuertes de frontera y su administración uniforme. [[velmoria|Velmoria]] mantiene puertos y provincias costeras en el oeste.
<em>Pendiente de completar: regiones y culturas concretas.</em>`,
elyndar:`
Elyndar es el continente de los ríos y los barcos. Sus grandes cauces nacen lejos de la costa y desembocan en deltas inmensos donde la tierra se anega cada año; las lagunas, las llanuras de inundación y los campos de arroz dibujan un paisaje de agua bajo un clima cálido y húmedo, y las estaciones se miden por el nivel de las crecidas.
Aquí los humanos, los últimos en llegar, hicieron habitable lo que nadie quería: Ysolde Terrin organizó durante treinta años a las aldeas del delta para levantar diques, canales y compuertas, y de aquellas aldeas surgió una de las ciudades más activas del mundo. Desde sus muelles salieron las rutas que unieron los continentes. Hoy lo ocupa por completo [[velmoria|Velmoria]], cuyas ciudades están atravesadas por canales y puentes, y donde el contrato rige la vida pública.
<em>Pendiente de completar: regiones y culturas concretas.</em>`,
avernia:`
Avernia es el continente de las regiones diversas. Sus fiordos, llanuras centrales, tierras altas y bosques cerrados estuvieron durante siglos separados por la distancia y el clima, y se unieron más por pactos que por conquistas: matrimonios entre familias de pueblos distintos, asambleas comunes y alianzas renovadas generación tras generación. De esa tradición de negociar sin ganar nace buena parte de su política.
En sus tierras altas surgieron, según la tradición, los pueblos bestiales, a raíz de una maldición que un clan vencedor impuso a los jefes vencidos y que resultó hereditaria. Hoy es el lugar donde se cruzan las fronteras de los tres imperios: [[ithravell|Ithravell]] ocupa el sur y el este, y [[marvayne|Marvayne]], el norte y el oeste, y sus tensiones se negocian a menudo en las mismas mesas donde antes se pactaban los matrimonios.
<em>Pendiente de completar: regiones y culturas concretas.</em>`,
dragones:`
Los dragones son escasos y casi todos viven aislados, a menudo en cumbres o cavernas que han convertido en dominio propio. Los jóvenes cazan a diario, mientras que los viejos pueden pasar décadas sin moverse, de modo que muchas ruinas atribuidas a un dragón están, simplemente, vacías. Los pueblos que conviven con ellos los tratan como se trata a una tormenta: con respeto, con señales de aviso y con rutas alternativas.`,
gargolasc:`
Cuando coronan un templo o una fortaleza suelen ser obra de canteros que las tallaron para vigilar, y se dice que su mirada acompaña a quien entra. Las que cobran vida actúan como centinelas pacientes: pueden pasar años inmóviles y solo se mueven cuando alguien cruza aquello que se les encargó guardar.`,
basiliscos:`
Los cazadores de basiliscos, oficio escaso y mal pagado, se ayudan de espejos pulidos, de pantallas de cristal y del fuego, y rara vez trabajan solos. Sus guaridas se reconocen por la vegetación marchita y por la ausencia de aves e insectos en los alrededores.`,
grifos:`
Anidan en riscos y torres abandonadas, y cada pareja defiende un territorio de caza muy amplio. Un grifo criado desde el huevo puede aceptar a un jinete, pero casi nunca olvida su naturaleza salvaje, y quienes los emplean como monturas o vigías aprenden pronto a no darles la espalda.`,
fenix:`
Se cuenta que su canto anuncia finales y comienzos, y que sus cenizas, recogidas a tiempo, conservan una tibieza que no se apaga. Quienes han visto una la describen más como un fenómeno que como un animal, y las leyendas la asocian con quienes renacen de una pérdida.`,
wendigos:`
Los relatos sitúan su aparición tras inviernos de hambruna, en aldeas aisladas por la nieve, y hablan de una voz que imita a quienes ya han muerto. Los pueblos del norte los combaten con fuego, sal y hogueras mantenidas toda la noche, y desconfían de quien regresa del bosque demasiado delgado y demasiado hambriento.`,
yetis:`
Conocen los glaciares mejor que nadie y evitan los pasos transitados, de modo que los viajeros solo los ven de lejos, como una silueta clara entre la ventisca. Se dice que los guías de montaña dejan ofrendas de comida en los collados, no tanto por superstición como por prudencia.`,
sasquatch:`
Los leñadores y cazadores de los bosques profundos hablan de huellas enormes, de ramas rotas a una altura imposible y de un olor intenso que precede a su paso. Casi nunca atacan, pero tampoco toleran que se talen sus bosques, y quien insiste suele encontrar sus herramientas destrozadas.`,
mandragoras:`
Se arrancan con cuidado, a menudo atadas a un perro o con los oídos tapados con cera, y se usan en pequeñas dosis para anestesiar, bajar fiebres o preparar tintes y venenos. Los herbolarios las valoran tanto por su poder como por su rareza, y los alquimistas las pagan muy bien.`,
gorgonas:`
Quienes viven cerca de sus ruinas aseguran que el primer signo de su presencia son las estatuas demasiado realistas, con rostros congelados en una mueca de sorpresa. Los pocos que han sobrevivido a un encuentro hablan de un escudo pulido, de los ojos vendados y de mucha suerte.`,
hidras:`
Los pantanos donde habitan huelen a podredumbre y suelen estar rodeados de aguas oscuras que ni los animales beben. Sus cazadores trabajan con antorchas, cauterizando cada herida en cuanto se produce, y saben que una sola cabeza sin quemar puede deshacer horas de trabajo.`,
krakens:`
Los marinos de las rutas más lejanas llevan arpones, hachas y ofrendas, y no se burlan de quien asegura haber visto un tentáculo sobre la cubierta. Los barcos grandes los evitan navegando en convoy, y los pescadores de aguas profundas sostienen que las noches sin viento y con el mar demasiado liso son las más peligrosas.`,
manticoras:`
Cazan en los yermos y los bordes del desierto, de noche, y su cola es temida por el veneno que contiene. Los viajeros que cruzan sus territorios van en grupo, con fuego encendido y sin separarse de las bestias de carga, que son su presa favorita.`,
huargos:`
Se mueven en manadas numerosas, dirigidas por un macho viejo y astuto, y atacan sobre todo ganado, caravanas aisladas y patrullas pequeñas. Las aldeas fronterizas pagan a cazadores profesionales y mantienen perros de guardia, y nadie sale solo al camino con la nieve alta.`,
physeon:`
Para los mortales, Phýseon es sobre todo el pulso de las estaciones: la cosecha abundante que nadie esperaba, el parto que sale bien contra todo pronóstico y la fiebre que cede sin explicación. También es el origen de lo que asusta: enjambres, parásitos y enfermedades que se multiplican con la misma eficacia que cualquier ser vivo, y que los sanadores combaten sin poder culparla. Las religiones la entienden de formas distintas, pero todas coinciden en que su generosidad no tiene destinatario.`,
elyr:`
Se reconoce la influencia de El’yr en el instante en que un erudito comprende el principio que le faltaba, o cuando un pueblo disperso descubre la organización que lo convierte en reino. Esa misma chispa ha dado hospitales y archivos, pero también armas y sistemas de gobierno que oprimieron a millones. No es sinónimo de bondad: es la capacidad de traer algo nuevo al mundo, sin garantía alguna sobre lo que ese algo hará después.`,
aphanes:`
Los cronistas antiguos trataban sus obras como la poda de un árbol: sin esos finales no habría espacio para lo que viene. Pone fin a imperios que llevaban siglos gobernando, extingue plagas que de otro modo se extenderían sin control y borra tradiciones que ya no se sostienen. Para quienes lo viven es una fuerza difícil de aceptar; para quienes miran desde lejos, una necesidad.`,
nevar:`
Su autoridad se ejerce a través de Edran Veyl, pero se manifiesta también en las costumbres funerarias de todos los pueblos: la moneda en la boca, la hoguera, la tumba bajo un árbol o la rima que enseña a no volver la cabeza. Nev’ar no se deja conmover por súplicas ni por actos de bondad que busquen comprar un juicio más favorable, y esa imparcialidad es, para muchos, lo único justo que existe.`,
madre:`
Quienes asisten partos cuentan que a veces la sala se llena de una calma difícil de explicar, y que una mujer a la que nadie recuerda sostiene al niño un instante antes de que llore. Las parteras de todos los pueblos dejan una vela en la ventana sin preguntar nada, por costumbre y por respeto. Su niño dormido nunca ha despertado ni crecido, y nadie sabe de quién es.`,
tejedor:`
Los eruditos lo mencionan en los libros más antiguos y en los más recientes, siempre como un anciano distinto y siempre con el mismo hilo. Se dice que aparece cuando una ciudad está al borde de algo que todavía no sabe nombrar: un plano de diques, un principio matemático, una ley que reorganiza un reino. Nunca se queda a ver qué se hace con su regalo, y a veces ese regalo se convierte en algo que otros deberán destruir.`,
azote:`
Las crónicas de las ciudades que ardieron a su paso contienen versiones contradictorias: unas hablan de una figura de humo y ceniza, otras de un guerrero sin rostro, otras de una sombra que avanza contra el viento. Lo único constante es la espada en llamas y el látigo, y la sensación de que, cuando llega, ya es demasiado tarde para correr. Los pueblos que sobrevivieron a su paso lo recuerdan con miedo y con una extraña gratitud.`,
edran:`
Edran Veyl no se parece a ningún ser conocido: los testigos lo describen como un anciano, un cadáver, un alma en pena o una capucha vacía, y solo coinciden en la vieja guadaña. Cuando llega la hora de alguien, ninguna muralla, reino o magia puede esconderlo de lo que Nev’ar ha reclamado. No corre tras quienes huyen: cuando vuelven la mirada, ya está delante de ellos, esperando con paciencia.`,
karma:`
Los practicantes de la Magia de la Muerte consideran el Karma la parte más incomprendida de su disciplina, porque ningún ritual lo altera: se forma solo con la vida. Las religiones han intentado interpretarlo de formas distintas, pero ninguna tiene autoridad sobre él. El estado Excéntrico es especialmente extraño: no es un punto medio entre el bien y el mal, sino una anomalía que el propio juicio trata como excepción, y de la que nadie ha podido extraer una regla.`,
principios:`
Un hechizo menor no requiere círculos ni rituales: solo concentración, unos segundos y el esfuerzo de subir un tramo de escaleras. Un practicante competente enciende un fuego, cierra un corte o levanta una barrera ligera decenas de veces al día. Los hechizos de combate cuestan lo que cuesta una pelea larga, y los exigentes, como detener un río o sostener una barrera durante horas, requieren grupos de practicantes y dejan agotados a quienes los hacen. Casi nadie empieza siendo poderoso: la maestría se construye con años de práctica.`,
cuerpo:`
Un sanador competente atiende a varios soldados en una misma jornada, cierra una herida de combate en pocos minutos y detiene una hemorragia en segundos, sin trances ni sacrificios. Las intervenciones largas, como recomponer órganos o tratar dolencias antiguas, exigen horas de concentración y conocimiento anatómico. Esa asimetría explica por qué los buenos sanadores abundan en los ejércitos y escasean en las aldeas pobres, donde sigue mandando la herbolaria.`,
alma:`
Los usos cotidianos son sencillos: consolar un duelo, aliviar una pesadilla, detectar presencias en una casa o proteger la mente de influencias ajenas. La influencia sobre voluntades puede ser un empujón sutil que facilita una conversación o una forma mucho más intrusiva, que deja huellas en ambos. Por eso las leyes de casi todos los territorios castigan con dureza la coacción, y los practicantes del alma suelen aprender un código ético antes que cualquier técnica.`,
muerte:`
La mayor parte de lo que hace un practicante de la Muerte es modesto y piadoso: aliviar agonías, retrasar una muerte hasta que llegue un sanador, conservar un cuerpo para un entierro lejano. Animar un cadáver simple exige concentración sostenida, pero no es un ritual. Los intentos de resurrección son otra cosa: se pagan con años de vida, recuerdos o partes del propio cuerpo, y nunca devuelven a la misma persona. Un alma ya juzgada solo vuelve si Nev’ar lo permite.`,
elemental:`
Es la disciplina más visible y la más enseñada con fines bélicos: bolas de fuego, descargas eléctricas, muros de piedra, ráfagas de viento. Pero también está en el oficio de los herreros, que calientan el metal con un gesto, en los albañiles que asientan piedra y en los marinos que orientan el viento. Los encantamientos de objetos requieren días de trabajo junto a un artesano, y los más poderosos se desgastan con el uso o se rompen si se les exige demasiado.`

[['momias','Momias','Cuerpos preservados',`Cadáveres conservados mediante ungüentos, vendas y rituales funerarios, que en ciertas tradiciones se animan para custodiar tumbas y archivos. A diferencia de los muertos vivientes comunes, su preservación es obra de artesanos y sacerdotes, y su cuerpo resiste siglos sin descomponerse.
Se mueven con lentitud, pero con una paciencia inagotable, y suelen estar ligadas a un lugar o a un objeto. Arden con facilidad, y quienes las enfrentan lo saben: el aceite y la antorcha son la respuesta habitual de saqueadores y custodios.`],
['esqueletos','Esqueletos','Huesos animados',`Restos óseos animados, casi siempre mediante la [[muerte|Magia de la Muerte]], que obedecen órdenes simples. Los hay en criptas, campos de batalla y templos clausurados, y su fabricación es la forma más barata de levantar un ejército de cadáveres, motivo por el que está prohibida en casi todos los territorios.
Son frágiles frente a los golpes contundentes y no sienten dolor ni miedo, pero carecen de iniciativa: sin un hechicero cerca, tienden a repetir la última orden recibida.`],
['espectros','Espectros','Presencias sin cuerpo',`Presencias sin cuerpo que persisten en lugares con una historia violenta o un dolor mal resuelto. Los practicantes de la [[alma|Magia del Alma]] los distinguen de los muertos, cuyo destino pertenece a Nev’ar, y los tratan como presencias que pueden calmarse, expulsarse o escucharse.
Su efecto va desde un frío súbito hasta la posesión temporal, y casi siempre desaparecen al resolverse lo que los ata. Casas, caminos y ruinas antiguas son sus lugares habituales.`],
['arpias','Arpías','Rapaces con rostro humano',`Criaturas con cuerpo de ave de presa y rostro humano, que anidan en acantilados, ruinas altas y torres abandonadas. Son ruidosas, crueles y territoriales, y atacan en bandada a viajeros y rebaños.
Los pastores y los marinos las alejan con ruido, fuego y redes, y algunos cazadores las persiguen por sus plumas, apreciadas por los flecheros.`],
['trols','Trols','Gigantes toscos de las rocas',`Seres toscos de piel gruesa y gran fuerza, que viven bajo puentes, en cuevas y en desfiladeros solitarios. Muchos cobran peaje a viajeros y caravanas, y los más viejos se confunden con las rocas durante el día.
Se recuperan de las heridas con facilidad, y quienes los combaten aprenden pronto que el fuego los detiene mejor que el acero. No deben confundirse con los [[gigantes|gigantes]], una raza antigua y no reproductiva, ni con los ogros.`],
['quimeras','Quimeras','Bestias de cuerpo compuesto',`Monstruos de cuerpo compuesto, con cabeza de león, cuerpo de cabra y cola de serpiente, que acechan en riscos y valles aislados. Algunos eruditos sospechan que son fruto de una magia corporal abandonada; otros, que han existido siempre.
Su fuego y su veneno las hacen temibles, y los pueblos que viven cerca de sus guaridas suelen pagar a cazadores profesionales.`],
['ents','Ents','Árboles con voluntad',`Árboles ancianos dotados de voluntad y movimiento, que custodian bosques antiguos con una paciencia que se mide en siglos. Hablan poco, con voces profundas, y apenas se distinguen de los troncos vivos hasta que se mueven.
Permanecen apartados de los asuntos de los mortales, pero responden con firmeza a quien tala sin permiso. Las hadas y los elfos los tratan con respeto.`]].forEach(p=>{SC.p.push(p);P[p[0]]={s:SC,id:p[0],t:p[1],b:p[2],x:p[3],g:[]};A.push(P[p[0]])});

Object.assign(X,{
humanos:`\nLos humanos viven pocos años, y esa brevedad explica su urgencia: aprenden deprisa, enseñan con prisa y cambian de costumbres en una temporada. Son la raza dominante en Solgravia, pero también la más presente en los imperios pluriespecie, donde conviven con elfos, enanos y orcos. Su diversidad cultural es tan amplia que hablar de «lo humano» sirve de poco.`,
elfos:`\nSu memoria larga hace que muchas disputas actuales sean, para ellos, la continuación de agravios antiguos. Se organizan en cortes, arboledas y casas que se consideran herederas legítimas de la canción original, y su trato con los pueblos breves oscila entre la curiosidad y la distancia. Yavannor es su reino de una sola especie, aunque también viven en los imperios.`,
enanos:`\nLos enanos valoran la obra bien hecha por encima de casi todo: una pieza que dure siglos es más honrosa que una fortuna. Su cultura es archivística: registran cosechas, pesos, tratados y genealogías en piedra y pergamino. Grimvar es su reino, y sus casas están presentes en los imperios como herreros e ingenieros.`,
orcos:`\nSu ley oral obliga a los jueces a abstenerse de los asuntos de su propia familia, y esa regla les da fama de justos entre los pueblos que la conocen. Muchos orcos sirven como intermediarios, mercaderes y mercenarios, y los hay también en los ejércitos de los imperios. Tharzug es el reino que los reúne.`,
vampiros:`\nLa sociedad vampírica valora la antigüedad de la sangre: los Vampiros Puros ocupan los puestos de prestigio, y los convertidos suelen servir. Tras el Cierre, varias casas fueron perseguidas por haber dado refugio a sacerdotes fugitivos, y desde entonces muchas viven bajo pactos o en la discreción. Su relación con los licántropos sigue marcada por una enemistad antigua.`,
hbestia:`\nNo existe una sola cultura de los pueblos bestiales: cada linaje conserva su propia lengua, sus costumbres y su manera de recordar el origen de la maldición, como un blasón, un olvido o una amargura. Algunos viven en aldeas de tierras altas; otros, ocultos en las ciudades. La persecución los ha vuelto cautos con los forasteros.`,
gigantes:`\nQuedan muy pocos, casi todos en regiones polares, donde viven solos o en grupos de tres o cuatro. Los balleneros ven a veces figuras altas inmóviles sobre los glaciares y dejan pequeñas piedras apiladas en la nieve. Su esterilidad es irreversible: ninguna magia ha logrado revertirla, y su historia se conserva en cordones que nadie sabe leer.`,
ciclopes:`\nLos cíclopes suelen evitar las ciudades y prefieren la soledad de los valles y las montañas, donde crian ganado o cultivan. Se dice que su único ojo ve mejor de lejos que el de cualquier otra raza, y que su memoria para los caminos es excelente. Los viajeros que los han tratado hablan de una hospitalidad severa pero sincera.`,
ogros:`\nLos ogros que viven en tribus reconocen jefes por su fuerza, pero los que viven en familias suelen estar gobernados por los ancianos. Los que han convivido con otros pueblos trabajan como estibadores, leñadores, mineros o guardias. Su fama de brutos es, en parte, el resultado de las historias de quienes solo conocieron a los que saqueaban.`,
hadas:`\nSon pequeñas pero no inofensivas: sus aptitudes mágicas innatas pueden proteger un bosque o desorientar a un viajero hasta que abandone sus dominios. Muchas comunidades se relacionan con los pueblos vecinos mediante pactos y ofrendas; otras evitan el contacto. Quien las trata como un solo pueblo suele descubrir su error con rapidez.`,
duendes:`\nLos duendes prosperan donde otros desechan: reciclan metales, reparan aperos y comercian con lo que encuentran. Sus comunidades pequeñas son móviles y se adaptan a cualquier entorno, y se les ve en ruinas, cuevas, mercados y barrios de artesanos. Una misma familia puede incluir a un tendero honrado y a un ladrón de oficio.`,
sirenas:`\nSus asentamientos aislados y sus ciudades sumergidas son difíciles de visitar, de modo que casi todo lo que se sabe de ellas procede de marinos, pescadores y los pocos comerciantes que han tratado con sus embajadores. Algunas comunidades intercambian perlas, coral y conocimiento de las corrientes por herramientas de metal.`,
centauros:`\nLos centauros nómadas siguen las estaciones y los pastos, mientras que los asentados levantan aldeas en llanuras y claros de bosque. Sus costumbres varían tanto según la región que es difícil hablar de una sola cultura. Los viajeros que han cabalgado con ellos hablan de una resistencia asombrosa y de una gran sensibilidad al terreno.`,
minotauros:`\nLos minotauros nacidos de una maldición, o descendientes de quienes la sufrieron, han fundado aldeas propias, sobre todo en montañas y tierras altas. No todos conservan la misma fuerza ni el mismo temperamento: algunos son pastores y artesanos pacíficos, y otros, soldados a sueldo. Muchos prefieren que no se hable de su origen.`,
gargolas:`\nLas gárgolas naturales surgen en lugares de piedra antigua donde las condiciones son propicias, y su comportamiento puede variar mucho de una a otra. Las artificiales se crean para custodiar templos, fortalezas y archivos, y las hay que, al quedar sin su propósito, se marchan a formar pequeñas comunidades. En ambos casos, su paciencia es legendaria.`,
golems:`\nSu construcción depende de materiales y técnicas que varían de un creador a otro: un golem de arcilla es barato y torpe; uno de metal exige herramientas, tiempo y conocimientos. Los que desarrollan voluntad propia, un hecho excepcional, suelen pedir que se les deje elegir su propósito. Su número solo depende de quienes puedan fabricarlos.`,
muertosv:`\nLa mayoría de los muertos vivientes son instrumentos: cuerpos animados por un hechicero que se sostienen mientras dura el vínculo. Los que conservan memoria y personalidad son una excepción inquietante, pues han vuelto de un modo que Nev’ar no suele conceder. Donde la Magia de la Muerte está prohibida, su sola presencia es motivo de persecución.`,
inmortales:`\nCada inmortal es distinto: unos llegaron a su condición por un pacto, otros por un ritual fallido o una herencia olvidada. Todos viven con el peso de ver morir a quienes les rodean, y todos guardan una condición particular, un objeto, un lugar o un acto, que puede conducir a su muerte definitiva. Casi ninguno la revela.`,
exanimes:`\nLos exánimes no duermen ni comen como los vivos, y sus cuerpos pueden seguir funcionando sin órganos vitales. Los estudiosos discuten si son una anomalía de la Magia de la Muerte o algo más antiguo. Ninguna comunidad los ha reconocido como propios, y casi todos los que se conocen viven aislados.`,
abisales:`\nLas regiones donde aparecen suelen reconocerse porque la realidad se comporta de manera incoherente: distancias que no coinciden, sonidos sin origen, sombras fuera de lugar. Quienes han sobrevivido a un encuentro rara vez coinciden en lo que vieron. Ninguna disciplina mágica conocida explica sus efectos.`,
serafines:`\nLos pocos relatos que existen coinciden en que cada serafín parece cumplir un propósito concreto. Su aspecto es muy diverso, y los testigos suelen sentir que han presenciado algo que no era para ellos. Los eruditos los consideran la prueba más cercana de que los principios pueden actuar sin intermediarios mortales.`
