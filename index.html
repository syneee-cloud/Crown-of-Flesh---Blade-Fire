const SE={id:'economia',t:'Economía y precios',i:'Monedas, precios habituales, salarios y niveles de riqueza.',p:[
['monedas','Monedas y equivalencias','Cobre, plata y oro',`En todo el mundo conocido circulan tres monedas de metal acuñado: el cobre, la plata y el oro. Su equivalencia es la misma en los imperios, los reinos y los puertos libres, y los cambistas, que cobran por convertir unas en otras, nunca la discuten.
§1 moneda de cobre|1 cobre
§1 moneda de plata|10 cobre
§1 moneda de oro|10 plata = 100 cobre
El cobre es la moneda de la calle: paga el pan, la cerveza y el jornal. La plata es la del artesano y el pequeño mercader, y sirve para herramientas, alquileres y ropa. El oro es la del comercio al por mayor, las dotes, las armaduras y los tributos, y un campesino puede pasar años sin ver una.
Los grandes contratos se cierran con pagarés y créditos que los puertos y los gremios honran, pero la moneda sigue siendo lo único que se acepta en una taberna de frontera. Los precios de las páginas siguientes son habituales, no obligatorios: varían con la región, la estación y la distancia al mercado.`],
['alimentos','Alimentos y bebidas','Precios de mesa y de taberna',`Un jornalero gana unos cinco cobre al día, y la mayor parte se le va en comer: pan, grano y cerveza floja en casa. Comer fuera es un lujo, y el precio del pan es el que más vigilan las ciudades, porque de él depende la calma de los barrios pobres.

Los vinos de las grandes bodegas, las especias de lejos y la carne fresca fuera de temporada multiplican esos precios, y en los puertos libres es normal pagar el doble por lo que viene de ultramar.`],
['alojamiento','Alojamiento, servicios y animales','Techo, cuidados y monturas',`Dormir bajo techo cuesta poco si se comparte, y mucho si se quiere intimidad. Los servicios de los sanadores licenciados se pagan por acto, y las monturas se valoran como una inversión de varios meses de trabajo.

['equipo','Armas, armaduras y equipo','Lo que cuesta ir preparado',`Las armas y las armaduras son las compras más caras de la vida de un soldado. Una espada equivale a unos cuarenta jornales de un jornalero, y una armadura de placas, a la fortuna de una familia entera. Las cifras son de armas corrientes; las obras de armeros famosos o las piezas encantadas valen muchas veces más.

['salarios','Salarios y oficios','Cuánto se gana al día',`Los jornales se pagan por día de trabajo, y un mes ordinario tiene unas veinticinco jornadas. Un jornalero reune así poco más de un oro al mes, y un artesano cualificado, casi tres. Los oficios con riesgo, con estudios o con responsabilidad cobran más, y los que incluyen comida y cama cobran menos en moneda.
§Aprendiz, con comida y cama|1 cobre
§Criado doméstico, con comida y cama|4 cobre
§Pastor|4 cobre

§Oficial de ejército|45 cobre
§Capitán de navío|60 cobre
§Gobernador o alto cargo|200 cobre
Con estas cifras, un soldado de línea ahorra una espada con un par de meses de paga, un sanador licenciado se compra una cota de malla en medio año y un jornalero tardaría más de una vida en juntar una armadura de placas.`],
['riqueza','Niveles de riqueza','Quién vive cómo',`La riqueza no se mide solo en monedas, sino en lo que se puede dejar de hacer: quien vive de su jornal depende cada día del trabajo, y quien vive de rentas puede no volver a tocar una herramienta. Estas cifras describen el gasto habitual y el patrimonio aproximado de cada nivel.
§Indigencia|menos de 1 cobre al día
§Pobreza|3 a 5 cobre al día; menos de 5 oro
§Modestia|8 a 12 cobre al día; de 5 a 30 oro
§Comodidad|unos 30 cobre al día; de 30 a 300 oro
§Riqueza|unos 100 cobre al día; de 300 a 3.000 oro
§Gran fortuna|más de 300 cobre al día; más de 3.000 oro
Los indigentes viven de la caridad y de lo que encuentran. Los pobres tienen oficio pero ningún margen: una enfermedad o una mala cosecha los arruina. Los modestos poseen herramientas, un techo y algo de ahorro, y son la columna de las ciudades. Los acomodados tienen casa propia, criados y crédito, y los ricos, tierras, flotas o talleres. Las grandes fortunas pertenecen a las casas nobles, a los gremios mayores y a los mercaderes de ultramar, y casi siempre se componen de propiedades más que de monedas.
El nivel de vida cambia según el imperio: en los de estructura mercantil abunda el crédito y la clase media; en los aristocráticos pesa el linaje, y en los centralizados, el mérito reconocido por el Estado.`]]};

Object.entries({
yavannor:`\nSus bosques ocupan el corazón de Eldoria, rodeados por las tierras de [[marvayne|Marvayne]], con quien mantiene una frontera antigua y cuidadosa.\n<em>Pendiente de completar: sistema político, economía y relaciones.</em>`,
solgravia:`\nSus tierras ocupan las llanuras centrales de Avernia, entre los territorios de [[marvayne|Marvayne]] y de [[ithravell|Ithravell]], una posición de frontera que condiciona su política.\n<em>Pendiente de completar: sistema político, economía y relaciones.</em>`,
grimvar:`\nSus fortalezas se alzan en las montañas del norte de Valdren, dentro de las tierras de [[ithravell|Ithravell]], sin formar parte de él.\n<em>Pendiente de completar: sistema político, economía y relaciones.</em>`,
tharzug:`\nSus clanes recorren las estepas y las tierras altas del este de Valdren, junto a la frontera con Avernia.\n<em>Pendiente de completar: sistema político, economía y relaciones.</em>`,
antes:`\nLos estratos de las montañas guardan las huellas de aquellas edades: bosques calcinados, mares retirados que dejaron desiertos de sal, capas enteras de vida compactada. Los cronistas antiguos no las leían como castigos, sino como podas, y entendían que sin esos finales no habría habido espacio para lo que vino después. De ese mismo mundo salieron las bestias, los parásitos y las formas sin ojos que aún habitan los rincones menos transitados.\nLas cuatro fuerzas dependían entre sí de un modo que ningún mortal comprendería hasta mucho después: la vida daba lo que el final reclamaba, la creación daba forma a lo que el final dejaba libre y la muerte recibía lo que ya no podía sostenerse, de modo que todo pudiera volver a empezar. Si alguna hubiera faltado, el mundo habría sido una sola cosa, y una cosa única no habría tenido historia.`,
aurora:`\nPara los pueblos nuevos, el primer problema fue aprender a vivir juntos. Los elfos medían el tiempo en siglos, los orcos en estaciones de marcha y los humanos en cosechas, y esa diferencia de ritmos generó tantos malentendidos como acuerdos. Las ferias, los pesos comunes y las lenguas de comercio nacieron para suavizarlos, y de ellas surgieron las primeras fortunas que no dependían de la tierra.\nTambién hubo prosperidad que acabó mal. Una ciudad célebre por la dulzura de su fruta vio propagarse una fiebre desconocida, se selló a sí misma para proteger al continente y murió durante casi un año tras sus murallas; una noche de otoño, quienes vigilaban el camino vieron una figura envuelta en humo cruzar las puertas cerradas sin abrirlas. Por la mañana solo quedaba ceniza, y la fiebre no volvió.`,
umbral:`\nLos primeros pasos fueron prácticos y se pagaron caros. Cerrar un corte costaba al sanador una tarde de cansancio, recomponer un hueso, días de un dolor sordo instalado en su propio cuerpo, restaurar un órgano, años de vida. Ysmerai Dohl dejó escrito que esa proporción no era una crueldad del método, sino su estructura: la carne no obedece, solo cede lo que se le devuelve.\nLa Magia de la Muerte nació en las ciudades de los muertos, entre quienes cuidaban catacumbas, jardines de memoria y necrópolis. Aprendieron a conservar cuerpos, a aliviar la agonía tomando parte del dolor y a conocer algo del destino que Nev’ar disponía. Los templos que levantaron eran ciudades enteras, con escuelas, hospicios y bibliotecas, y los novicios aprendían una frase que unos tomaban por advertencia y otros por descripción: quien se acerca a la frontera sin pagar, la frontera lo cobra por su cuenta.`,
templos:`\nEl Edicto del Cierre no cayó sobre todos los templos por igual. Muchos se rindieron sin resistencia; una comunidad dedicada a aliviar agonías obtuvo permiso para seguir bajo vigilancia; y Orsolya Kendrel, que había propuesto regular antes que prohibir, logró que parte de los archivos se sellara en bóvedas. Existen todavía, aunque se discute dónde están y quién tiene las llaves.\nLas consecuencias duraron siglos: el conocimiento perdido no ha vuelto a encontrarse entero, los practicantes que escaparon huyeron a desiertos, islas y fronteras sin ley, las casas de vampiros que habían dado refugio a sacerdotes quedaron marcadas, y los licántropos, contratados como rastreadores a cambio de tierras, vieron reavivada una enemistad que el tiempo había ido enfriando. Se generalizó la cremación, y los niños aprendieron una rima: quien se vuelve a mirar, lo encuentra delante.`,
mundo:`\nEl mundo que heredó esa edad es ocupado y mercantil. Tres imperios de escala comparable, habitados por varias especies, comparten el mundo con cuatro reinos de una sola especie, y entre unos y otros circulan caravanas, flotas, escuelas de magia, ejércitos y religiones que se disputan la fe. Nadie gobierna el mundo entero, y ninguna potencia es moralmente superior a otra.\nLas viejas heridas siguen abiertas: la prohibición de la Magia de la Muerte, la enemistad entre vampiros y licántropos, los cordones ilegibles de los gigantes y las bóvedas selladas. Nada obliga a nadie a ocuparse de ellas, pero el mundo, que nunca ha esperado a que alguien termine de entenderlo, sigue ofreciéndoselas a quien quiera tomarlas.`,
physeon:`\nPhýseon no distingue entre una criatura hermosa y una abominación, y por eso los eruditos hablan de su indiferencia generosa: ha dado origen a bestias capaces de consumir poblaciones enteras, a enfermedades que se multiplican con la misma eficacia que cualquier ser vivo y a criaturas tan deformes y voraces que ni quienes las estudian aciertan a explicar su propósito. No crea pensando en el bienestar de quienes ya existen: permite que exista más vida, sin importar la forma ni el daño.\nEn la vida cotidiana, su dominio es el de las parteras, los labradores, los herbolarios y los sanadores: todos trabajan con lo que Phýseon ya intenta hacer, y por eso la Magia del Cuerpo no crea carne de la nada. Quienes han intentado forzarlo, alterando la sangre o la carne más allá de lo natural, han descubierto que la vida no tiene filtro moral: lo que se multiplica, se multiplica.`,
elyr:`\nLos eruditos coinciden en una paradoja: es la fuerza que más ha cambiado el mundo y la que menos lo decide. Entrega la posibilidad de que un pueblo disperso se organice, de que una idea vaga se vuelva herramienta, de que un oficio se convierta en disciplina, pero no elige en qué se convierte aquello que ayuda a nacer. El mismo conocimiento que levanta un reino próspero puede entregar el necesario para construir un arma capaz de arrasar ciudades o un sistema de gobierno que oprima a millones durante generaciones.\nPor eso las religiones que la veneran dudan entre celebrar sus obras y temerlas. Los artesanos, los ingenieros y los estudiosos la sienten como una compañera en las horas de descubrimiento, y también como una sombra cuando lo que han creado se usa para destruir.`,
aphanes:`\nNo construye nada en el lugar de lo que derriba: su función termina en el instante en que algo deja de existir, y lo que venga después no le concierne. Esa limitación explica su aparente crueldad y también su utilidad: un imperio que ya no puede sostenerse, una plaga que se propagaría sin control o una tradición insostenible caen cuando ha llegado su hora, sin importar cuánto hayan resistido ni cuántos juraron que no caerían.\nNo juzga culpas ni intenciones. Una civilización corrupta y una comunidad inocente que se encontraba en el lugar equivocado reciben el mismo final cuando la destrucción se hace necesaria para el equilibrio del mundo, y los pueblos que han sobrevivido a su paso lo recuerdan con miedo y con una extraña gratitud.`,
nevar:`\nEs la única de las cuatro fuerzas que administra directamente una forma de justicia: retiene a las almas que causaron un daño profundo para que no puedan continuar causándolo más allá de la tumba. Pero no es benévola. No perdona por compasión ni condena por crueldad: puede encerrar para siempre a un alma verdaderamente injusta y, con la misma frialdad, condenar a alguien cuyas intenciones fueron buenas si el resultado de sus acciones fue destructivo.\nNingún mortal puede evitar ni negociar directamente su juicio. Puede, en circunstancias excepcionales, permitir que un alma regrese al mundo de los vivos a cambio de un precio, y ningún hechizo la obliga a ello: lo que se entrega, ya sean años, recuerdos, el propio cuerpo o tareas que el difunto no elige, lo decide el juicio.`,
madre:`\nSe dice que está presente en cada nacimiento, aunque casi nadie llega a percibirla. Acompaña el crecimiento de lo que brota de la tierra, sostiene a las madres cuando la vida se resiste a llegar y asiste en silencio al instante exacto en que algo deja de ser posibilidad y empieza a ser existencia. Su apariencia cambia según quien la recuerde: una mujer humana de mirada cansada, una elfa de cabello blanco, una orca de manos curtidas o una enana con el pelo trenzado de flores.\nNo decide quién merece vivir ni cuánto debe durar esa vida: solo se asegura de que, sea breve o larga una existencia, llegue a comenzar.`,
tejedor:`\nNadie sabe de dónde viene ni si alguna vez fue otra cosa. Aparece en las historias más antiguas ya como un anciano de barba blanca, y sigue apareciendo así en los relatos más recientes, aunque su ropa, su idioma y los objetos que lo acompañan cambian según la cultura que lo recibe.\nNo construye nada con sus propias manos: entrega la posibilidad de construirlo y se retira antes de ver qué se hace con ella. Puede entregar el saber necesario para levantar un reino, pero nunca decide en qué se convertirá ese reino con el paso de los siglos.`,
azote:`\nDestruye civilizaciones, estructuras y fenómenos cuando su desaparición se ha vuelto necesaria para el orden del mundo. No pregunta quién es culpable y quién inocente, porque juzgar no es su función: termina lo que debe terminar, sin importar cuántas vidas queden atrapadas en el proceso.\nNo corre hacia las civilizaciones que debe destruir, y no necesita hacerlo. Para cuando llega, siempre es demasiado tarde para que ellas corran.`,
edran:`\nAntes de ser Heraldo, Edran Veyl fue un hombre dedicado a estudiar la muerte. Durante años experimentó con las artes prohibidas, primero para comprender qué ocurría después del último aliento y, con el tiempo, para retrasar la suya, y cada intento le arrebató algo: el sueño, el recuerdo del rostro de su madre, el calor de su sangre. Murió y regresó, pero no entero, y Nev’ar reconoció en él una capacidad que no estaba dispuesta a desperdiciar.\nDesde entonces conduce a los muertos hacia el Más Allá y examina el registro de sus almas. Algunos hallan descanso; otros quedan encerrados; unos pocos reciben una segunda oportunidad a cambio de algo valioso. No fue un villano ni un vencedor de la muerte: fue un mortal admitido en el umbral que quiso cruzar.`,
karma:`\nEl Karma Benigno aparece cuando las acciones de una persona dejan una influencia predominantemente favorable sobre el mundo. Quienes mueren con este estado son conducidos al Más Allá, donde sus almas pueden permanecer sin condena. No exige pureza: solo registra el resultado general de una existencia, de modo que alguien que causó sufrimiento o cometió actos terribles puede terminar con Karma Benigno si el conjunto de su vida produjo consecuencias favorables suficientes.\nEl Karma Maligno aparece cuando las consecuencias destructivas predominan. Las almas que mueren así son condenadas y permanecen encerradas, sin posibilidad de abandonar el lugar al que fueron destinadas, y la condena no tiene una duración determinada. Tampoco significa que todos sus portadores fueran crueles: una persona pudo actuar con buenas intenciones toda su vida y haber dejado consecuencias que perjudicaron al mundo.\nEl Karma Excéntrico no es neutralidad, ni un punto medio, ni una vida equilibrada: es una anomalía. Aparece cuando las acciones benignas y malignas alcanzan un equilibrio extraordinariamente preciso, o en quienes murieron demasiado jóvenes para trazar un rumbo. Es el estado más raro y el más difícil de prever, y cada caso es único.\nAl morir, el alma queda bajo la autoridad de [[edran|Edran Veyl]], que recorre las acciones realizadas y las consecuencias que dejaron. El juicio puede parecer interminable al alma, pero durante él no transcurre tiempo fuera de él: un cadáver puede seguir en el suelo mientras su alma vive una eternidad, y por eso quienes reciben una oportunidad pueden volver a su cuerpo casi en el mismo instante en que murieron.`

const SK={id:'cronicas',t:'Crónicas',i:'Orígenes, relatos y bitácoras de un mundo con siglos de memoria.',p:[
['cr_ithravell','Origen de Ithravell','Nació de la victoria',`Ithravell nació de la victoria. Cuando la alianza que clausuró los templos de la muerte se disolvió, la potencia que la había dirigido, un reino de peaje levantado en el único desfiladero practicable de Valdren, no desmovilizó su ejército y conservó los archivos, los caminos y a los funcionarios que los administraban. Su canciller, Orsolya Kendrel, había perdido a un hermano en la guerra de los cadáveres y creía que solo una ley escrita y común evitaría la siguiente.
De ese convencimiento salió una costumbre que los sucesores llevaron muy lejos: cada pueblo anexionado conservaba sus costumbres mientras no chocaran con la ley, y quien servía en el ejército o en la administración obtenía la ciudadanía. Los pactos con los vecinos sustituyeron a las conquistas, aunque nunca las reemplazaron del todo, y en dos o tres siglos el reino era un imperio con calzadas, gobernadores y un consejo. Hoy es [[ithravell|Ithravell]].`],
['cr_marvayne','Origen de Marvayne','Nació de las ruinas',`Marvayne nació de las ruinas. Tras el Cierre, Eldoria era un mosaico de cortes élficas, villas humanas y casas de linaje antiguo, cada una con su fortaleza y sus agravios, y los templos clausurados dejaban en cada valle un casco de piedra vacío. Una casa, la de Marvayne, logró lo que las demás consideraban imposible: reunirlas bajo un juramento pronunciado en las ruinas de uno de aquellos templos, donde ningún bando podía alegar ventaja.
El juramento fijó dos reglas que aún estructuran el imperio: la corona arbitra sin gobernar por decreto, y cada casa conserva sus tierras a cambio de su palabra. Durante generaciones, la corona se consolidó mediante matrimonios y alianzas antes que por guerras, y las casas aprendieron a considerar la memoria un patrimonio común. Por eso [[marvayne|Marvayne]] trata sus ruinas como cimientos y no como cicatrices.`],
['cr_velmoria','Origen de Velmoria','Nació de una costumbre',`Velmoria empezó siendo una costumbre. Las ciudades del delta, herederas de Ysolde Terrin y de sus diques, comerciaban desde hacía milenios con las demás orillas bajo una práctica común: lo pactado se cumple, y quien lo incumple pierde el acceso a los puertos de todos. Tras el Cierre, esa práctica se escribió y se llamó derecho de puertos, y unos cuatro siglos después una carta común federó a las ciudades de los ríos bajo asambleas de ciudadanos y gremios y un magistrado elegido por un periodo fijo.
De esa federación nació el imperio: no por conquista, sino por tratados, créditos y flotas que hicieron más rentable pertenecer que quedarse fuera. [[velmoria|Velmoria]] conserva el espíritu en un fragmento de la bitácora de un capitán de aquellos años:
<em>«Día 41. Entramos en puerto con la marea. Los aduaneros no pidieron armas, sino el registro de la carga y el nombre del fiador. Firmamos antes de comer. Quien firma aquí, firma en todas partes.»</em>`],
['cr_vampiros','Origen de los vampiros','De una negativa a morir',`La historia de los vampiros empieza con una enfermedad. Maelis Dorrane, médica de una casa noble de Valdren, enfermó a los cuarenta años de una dolencia de la sangre para la que ningún colegio tenía remedio, y se negó a aceptar su final. Durante once años trabajó con la [[cuerpo|Magia del Cuerpo]] sobre su propio organismo, sustituyendo la sangre que fallaba por otra que ella misma aprendió a modificar, hasta lograr que su cuerpo dejara de depender de la muerte para renovarse.
Vivió cuatro siglos más y administró su casa con competencia notable, pero la luz del día se le hizo insoportable y su alimento, cada vez más particular. Sus primeros hijos y discípulos recibieron su sangre y fueron los Alfas Originales, algunos capaces de adoptar la forma de enormes murciélagos; de ellos descienden los Vampiros Puros, y de las mordidas de unos y otros, los convertidos. Véase [[vampiros|Vampiros]].
<em>Del cuaderno de Maelis: «No temo a la muerte; la tengo cada mañana en el espejo. Temo que se pierda lo que aprendí.»</em>`],
['cr_rivalidad','La rivalidad entre vampiros y licántropos','Dos versiones de una afrenta',`Nadie sabe con certeza cuándo empezó la hostilidad entre vampiros y licántropos, porque cada bando la cuenta de un modo distinto y ninguna versión puede verificarse. Los vampiros sostienen que, hace siglos, una casa pactó con un clan licántropo el reparto de los bosques fronterizos, y que el pacto se rompió el día en que los licántropos mataron al heredero de la casa en una noche de luna. Los licántropos, en cambio, cuentan que fue la casa quien rompió el trato al cazar en territorio clánico para alimentarse, y que el heredero murió defendiendo lo que no era suyo.
Lo único en que ambos coinciden es que, desde entonces, ninguno ha querido olvidar la afrenta del otro. La enemistad se enfrió durante siglos y se reavivó tras el Cierre, cuando los [[hbestia|licántropos]] fueron contratados como rastreadores a cambio de tierras y las casas vampíricas que habían dado refugio a sacerdotes fugitivos quedaron marcadas.`],
['cr_cazadores','Origen de los cazadores de vampiros','Un oficio, no una orden',`Los cazadores de vampiros no nacieron de una orden, sino de un oficio. Durante la persecución que siguió al Cierre, los soldados desmovilizados de la alianza y los rastreadores licántropos recibieron una recompensa por cada casa vampírica descubierta, y cuando la recompensa se agotó, algunos siguieron cazando por su cuenta. Los pueblos fronterizos, que habían aprendido a temer a los vampiros, empezaron a pagarles por sus servicios.
Se fueron organizando en compañías pequeñas, con reglas sencillas: no cazar en poblado sin permiso, repartir la recompensa entre todos y no tratar con quien no se conoce. Sus herramientas son las que el oficio ha demostrado: plata, luz de sol, estacas, hogueras y un conocimiento minucioso de las costumbres de cada casa. El diario de uno de los primeros, Aldous Brann, resume su filosofía:
<em>«Tercer día. Seguimos el rastro hasta la bodega. La casa tenía las ventanas selladas y el vino sin abrir. Esperamos al amanecer. No se mata a un vampiro de noche: se le espera.»</em>`],
['cr_figuras','Figuras importantes','Quiénes hicieron el mundo',`Estas son algunas de las figuras que la memoria de los pueblos conserva.
<b>Edran Veyl.</b> Sacerdote que murió estudiando la muerte y regresó como Heraldo de [[nevar|Nev’ar]].
<b>Maelis Dorrane.</b> Médica que se negó a morir y dio origen a los vampiros.
<b>Orsolya Kendrel.</b> Canciller que defendió regular los templos antes que clausurarlos y sentó las bases de [[ithravell|Ithravell]].
<b>Ysolde Terrin.</b> Hija de pescador que levantó los diques del delta.
<b>Ysmerai Dohl.</b> Partera que convirtió la mano atenta en una disciplina.
<b>Kaldur Orren.</b> Rey archivista de los enanos y autor de la vara de medir.
<b>Sarn Vokh.</b> Orco que impuso el comercio antes que la guerra.
<b>Ilvaren Soth-Amaleth.</b> Legislador élfico de la ley cantada.
<b>Adelmira.</b> Reina cuyo regreso sin recuerdos desencadenó la guerra de los cadáveres.
<b>Selvaine Ardoch.</b> Sepulturera y partera, primera Concordante.
<b>Ewald Therran y Brenna Voss.</b> Fundador y mariscal del Naturalismo.
<b>Halvena Dreisk.</b> Médica elevada por [[physeon|Phýseon]] tras tres inviernos sin perder un enfermo.
<b>Brakka Sendar.</b> Orca que detuvo un ejército sin derramar su sangre.
<b>Aldous Brann.</b> Cazador de vampiros cuyo diario inspira al oficio.`],
['cr_cronologia','Cronología resumida','Los años, de lejos',`Las fechas son aproximadas y se miden en años antes o después del Cierre, el día en que se promulgó el edicto que inauguró el Cómputo.
§Despertar de los elfos|30.000 años antes
§Llegada de los humanos|7.000 años antes
§Descubrimiento de la magia|3.000 años antes
§Nacimiento de los vampiros|2.500 años antes aprox.
§Nacimiento de Edran Veyl|700 años antes
§El Cierre de los templos|Año 1 del Cómputo
§Nacimiento de Ithravell y de Marvayne|siglos después del Cierre
§Carta común de Velmoria|unos 400 después
§La época actual|unos 1.100 después
Las cifras anteriores al Cierre son estimaciones de cronistas y se contradicen entre culturas; las posteriores son más fiables, pero tampoco carecen de disputas.`]]};
